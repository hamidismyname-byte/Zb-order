<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zirlerberg Order</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZB Order">

<style>
:root{--bg:#0f1614;--sf:#18221f;--sf2:#22302b;--ln:#2e3d37;--tx:#eef2ef;--mu:#93a39c;--gd:#c9a45c;--ok:#2fbf71;--wa:#f0a92b;--er:#e5484d;--bl:#4ea1ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.fa{font-family:Vazirmatn,system-ui,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--ln)}
.brand{font-weight:800;letter-spacing:.5px;color:var(--gd)}
.role{font-size:13px;color:var(--mu);background:var(--sf2);padding:3px 9px;border-radius:999px}
.sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok)}.dot.off{background:var(--er)}
main{padding:14px 16px;max-width:1200px;margin:0 auto}
button,.btn{font:inherit;color:inherit;border:0;border-radius:12px;background:var(--sf2);padding:12px 14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}
.pri{background:var(--gd);color:#1a1406;font-weight:700}
.ok{background:var(--ok);color:#06200f;font-weight:700}
.wa{background:var(--wa);color:#2a1a00;font-weight:700}
.er{background:transparent;color:var(--er);border:1px solid var(--er)}
.ghost{background:transparent;border:1px solid var(--ln)}
.w{width:100%}
.ico{min-width:46px;padding:8px;font-size:20px;background:transparent}
input,textarea,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:80px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:10px}
.tables{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.tbtn{height:66px;font-size:20px;font-weight:700;position:relative;background:var(--sf);border:1px solid var(--ln)}
.tbtn .b{position:absolute;top:7px;inset-inline-end:7px;width:10px;height:10px;border-radius:50%;background:var(--wa)}
.tbtn .b.g{background:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none;position:sticky;top:calc(57px + env(safe-area-inset-top));background:var(--bg);z-index:4}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;min-height:40px;border-radius:999px}
.chip.act{background:var(--gd);color:#1a1406;font-weight:700}
.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{text-align:start;flex-direction:column;align-items:stretch;justify-content:space-between;min-height:84px;position:relative;background:var(--sf);border:1px solid var(--ln)}
.item .p{color:var(--mu);font-size:14px}
.item .q{position:absolute;top:-7px;inset-inline-end:-7px;background:var(--gd);color:#1a1406;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:14px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 16px;z-index:6;max-width:700px;margin:0 auto}
.cartbar button{box-shadow:0 8px 24px #000a;font-size:17px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav#tabs:empty{display:none}
nav#tabs button{flex:1;background:none;border-radius:0;min-height:64px;font-size:15px;color:var(--mu)}
nav#tabs button.act{color:var(--gd);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--er);color:#fff;font-size:12px;font-weight:800;padding:0 6px}
.badge.g{background:var(--ok);color:#06200f}
.board{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.ocard{border-inline-start:6px solid var(--bl)}
.ocard.late{border-inline-start-color:var(--wa)}.ocard.vlate{border-inline-start-color:var(--er)}.ocard.ready{border-inline-start-color:var(--ok)}
.ocard.new{animation:fl 1s ease 4}
@keyframes fl{50%{box-shadow:0 0 0 4px var(--gd)}}
.ohd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.tno{font-size:26px;font-weight:800}
.meta{color:var(--mu);font-size:14px}
.li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln);font-size:18px}
.li:last-child{border:0}
.li b{min-width:36px;color:var(--gd)}
.li.sm{font-size:15px;padding:4px 0}
.note{background:#3a2d10;color:#ffd98a;border-radius:8px;padding:3px 8px;font-size:15px;margin-top:4px;display:inline-block}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.st{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sf2)}
.st.neu{color:var(--bl)}.st.arbeit{color:var(--wa)}.st.fertig{background:var(--ok);color:#06200f;font-weight:700}.st.abgeholt{color:var(--mu)}
.row{display:flex;gap:10px;align-items:center}
.row>.f{flex:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts>*{flex:1 1 auto}
.sheetbg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetc{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;width:min(92vw,480px);pointer-events:none}
.toast{background:var(--ok);color:#06200f;font-weight:800;padding:14px 16px;border-radius:14px;box-shadow:0 10px 30px #000a;font-size:17px;pointer-events:auto}
.toast.info{background:var(--bl);color:#fff}.toast.err{background:var(--er);color:#fff}
h2{margin:6px 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:16px;color:var(--mu)}
.muted{color:var(--mu)}.sm{font-size:14px}
.qty{display:flex;align-items:center;gap:6px}.qty button{min-width:44px;padding:6px}
.qty span{min-width:26px;text-align:center;font-weight:800}
.big{font-size:22px;font-weight:800}
.stack>*+*{margin-top:10px}
code{background:var(--sf2);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.pinw{max-width:320px;margin:40px auto}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.seg{display:flex;background:var(--sf);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;background:none}
.seg button.act{background:var(--sf2);color:var(--gd);font-weight:700}
table.stat{width:100%;border-collapse:collapse}table.stat td{padding:6px 4px;border-bottom:1px solid var(--ln)}table.stat td:last-child{text-align:end}
.edrow{display:grid;grid-template-columns:1fr 92px 46px;gap:6px;margin-top:6px}
.strike{text-decoration:line-through;opacity:.55}
</style>
</head>

const FB={
  async init(){
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    this.fs=fs;const app=A.initializeApp(cfg.fb);
    try{this.db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){this.db=fs.getFirestore(app)}
    await Au.signInAnonymously(Au.getAuth(app));
    addEventListener('online',()=>setConn(true));addEventListener('offline',()=>setConn(false));setConn(navigator.onLine);
  },
  subOrders(cb){this.uo&&this.uo();const f=this.fs;
    this.uo=f.onSnapshot(f.query(f.collection(this.db,'orders'),f.where('day','==',dayKey())),s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),showErr)},
  subConf(cb){const f=this.fs;
    f.onSnapshot(f.doc(this.db,'config','main'),s=>{
      if(s.exists())return cb(s.data());
      if(!s.metadata.fromCache){const c=structuredClone(SAMPLE);f.setDoc(s.ref,c).catch(showErr);cb(c)}
    },showErr)},
  add(o){const f=this.fs;return f.setDoc(f.doc(this.db,'orders',o.id),o)},
  upd(id,p){const f=this.fs;return f.updateDoc(f.doc(this.db,'orders',id),p)},
  saveConf(c){const f=this.fs;return f.setDoc(f.doc(this.db,'config','main'),c)}
};

/* ============ Alarm: Ton, Vibration, Benachrichtigung, ntfy-Push ============ */
let AC=null;
addEventListener('pointerdown',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{capture:true});
function sound(kind){if(!AC)return;const n=AC.currentTime;
  const seq=kind==='ready'?[[880,0],[1175,.16],[1568,.32],[1568,.6]]:[[660,0],[880,.22],[660,.5],[880,.72]];
  for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.6,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+.28);
    o.connect(g);g.connect(AC.destination);o.start(n+d);o.stop(n+d+.3)}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function notify(title,body){try{
  if(!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;
  const r=await navigator.serviceWorker?.getRegistration();
  if(r)r.showNotification(title,{body,tag:uid(),vibrate:[300,100,300],icon:'icon-192.png'});else new Notification(title,{body});
}catch(e){}}

function toast(msg,kind='',ms=4500){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;d.onclick=()=>d.remove();$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}

function onOrders(list){
  const first=prev===null,np=new Map();
  for(const o of list){np.set(o.id,o);if(first)continue;const p=prev.get(o.id);
    if(me.role==='kitchen'){const s=me.station;
      if(!p&&!o.cancelled&&o.st?.[s]==='neu'){ui.seen.add(o.id);sound('new');vib([200,100,200,100,200]);
        toast('🔔 '+t('Neue Bestellung – Tisch')+' '+o.table,'info',6000);notify(t('Neue Bestellung – Tisch')+' '+o.table,itemsText(o,s))}
      if(p&&!p.cancelled&&o.cancelled&&o.st?.[s])toast('✖ '+t('Tisch')+' '+o.table+' – '+t('Storniert'),'err',8000)}
    if(me.role==='waiter'&&(me.alertAll||norm(o.waiter)===norm(me.name))){
      for(const s of Object.keys(o.st||{}))if(o.st[s]==='fertig'&&p?.st?.[s]!=='fertig'){
        sound('ready');vib([400,150,400,150,700]);
        const msg='✅ '+t('Tisch')+' '+o.table+' – '+t(STN[s])+' '+t('fertig');toast(msg,'',8000);notify(msg,itemsText(o,s))}}
  }
  prev=np;orders=list;render();
}

function render(){
  document.documentElement.lang=me.lang;document.documentElement.dir=me.lang==='fa'?'rtl':'ltr';document.body.classList.toggle('fa',me.lang==='fa');

  if(isEditing()){pending=true;return}

  else if(!conf)main=`<p class="empty">${t('Laden…')}</p>`;
  else if(me.role==='waiter')[main,tabs,bar]=waiterView();

  $('#sheet').innerHTML=ui.sheet?`<div class="sheetbg" data-a="closeSheet"><div class="sheetc" data-stop>${sheetView()}</div></div>`:'';
  if(ui.sheet==='settings'||(me.role==='admin'&&ui.atab==='setup'))drawQR();
}

function parseCfg(s){s=s.trim();try{const j=JSON.parse(s);if(j.apiKey)return j}catch(e){}
  const o={};for(const m of s.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];return o}

const hasReady=o=>!o.cancelled&&Object.values(o.st||{}).includes('fertig');
function waiterView(){

  if(ui.wtab==='mine')return [mineView(my),tabs,''];
  if(!ui.table){
    const occ={};for(const o of orders)if(isOpen(o))occ[o.table]=(occ[o.table]==='g'||hasReady(o))?'g':'y';
    return [`<h2>${t('Tisch wählen')}</h2><div class="grid tables">${conf.tables.map(x=>`<button class="tbtn" data-a="table" data-x="${esc(x)}">${esc(x)}${occ[x]?`<span class="b ${occ[x]==='g'?'g':''}"></span>`:''}</button>`).join('')}</div>`,tabs,''];
  }
  const cats=conf.cats.filter(c=>conf.items.some(i=>i.cat===c.id));
  if(!cats.find(c=>c.id===ui.cat))ui.cat=cats[0]?.id;
  const q={};for(const l of cart)q[l.itemId]=(q[l.itemId]||0)+l.qty;

function stChips(o){return `<div class="sts">${Object.entries(o.st||{}).map(([s,v])=>`<span class="st ${v}">${STI[s]} ${t(STN[s])}: ${t(STL[v])}</span>`).join('')}</div>`}

const A={
  lang(x){me.lang=x;saveMe();render()},
  demo(){cfg={mode:'demo',topic:genTopic(),ntfy:'https://ntfy.sh'};LS.set('zb_cfg',cfg);start()},
  connect(){const fb=parseCfg($('#fbcfg').value);if(!fb.apiKey||!fb.projectId)return toast(t('Konfiguration ungültig – apiKey und projectId fehlen.'),'err');
    cfg={mode:'fb',fb,topic:$('#topic').value.trim()||genTopic(),ntfy:'https://ntfy.sh'};LS.set('zb_cfg',cfg);start()},
  role(x){const nm=$('#nm').value.trim();me.name=nm;
    if(x==='waiter'&&!nm){toast(t('Bitte Namen eingeben'),'err');$('#nm').focus();return}
    if(x.startsWith('kitchen')){me.role='kitchen';me.station=x.split(':')[1];ui.ktab='open'}else me.role=x;
    saveMe();prev=null;start2();if(me.role==='kitchen'&&me.wake)wake(true)},
  settings(){ui.sheet='settings';render()},
  closeSheet(){ui.sheet=null;render()},
  changeRole(){me.role=null;saveMe();ui.sheet=null;ui.adminOk=false;wake(false);render()},
  async perm(){try{await Notification.requestPermission()}catch(e){}render()},
  async install(){ui.deferredInstall?.prompt();ui.deferredInstall=null;render()},
  copy(x){navigator.clipboard?.writeText(x).then(()=>toast(t('Kopiert'),'info',1500)).catch(()=>prompt('',x))},
  share(){navigator.share({title:'Zirlerberg Order',url:staffLink()}).catch(()=>{})},
  wtab(x){ui.wtab=x;render();scrollTo(0,0)},
  mineOnly(x){me.mineOnly=x==='1';saveMe();render()},
  table(x){ui.table=x||null;saveCart();render();scrollTo(0,0)},
  cat(x){ui.cat=x;render()},
  add(x){const it=conf.items.find(i=>i.id===x);if(!it)return;const st=conf.cats.find(c=>c.id===it.cat)?.st||'kueche';
    const l=cart.find(l=>l.itemId===x&&!l.note);if(l)l.qty++;else cart.push({key:uid(),itemId:x,name:it.name,price:+it.price,st,qty:1,note:''});
    vib(15);saveCart();render()},
  openCart(){ui.sheet='cart';render()},
  qty(x){const [k,d]=x.split(':');const l=cart.find(l=>l.key===k);if(!l)return;l.qty+=+d;if(l.qty<=0)cart=cart.filter(c=>c!==l);
    saveCart();if(!cart.length)ui.sheet=null;render()},
  clearCart(){cart=[];ui.onote='';ui.sheet=null;saveCart();render()},
  send(){if(!cart.length||!ui.table)return;
    const o={id:uid(),day:dayKey(),createdMs:Date.now(),table:ui.table,waiter:me.name,note:ui.onote.trim(),cancelled:false,st:{},
      items:cart.map(({name,price,qty,note,st,itemId})=>({name,price,qty,note:note.trim(),st,itemId}))};
    for(const i of o.items)o.st[i.st]='neu';
    write(Store.add(o));
    for(const s of Object.keys(o.st))push(topicStation(s),'🔔 '+t('Neue Bestellung – Tisch')+' '+o.table,itemsText(o,s)+(o.note?'\n⚠ '+o.note:''),['bell']);
    toast('📤 '+t('Gesendet')+' – '+t('Tisch')+' '+o.table,'info',2500);
    cart=[];ui.onote='';ui.sheet=null;ui.table=null;saveCart();render();scrollTo(0,0)},
  pickup(x){const [id,s]=x.split(':');write(Store.upd(id,{['st.'+s]:'abgeholt'}))},
  cancel(x){if(confirm(t('Wirklich stornieren?')))write(Store.upd(x,{cancelled:true}))},
  cancelAdm(x){if(confirm(t('Wirklich stornieren?')))write(Store.upd(x,{cancelled:true}))},
  uncancel(x){write(Store.upd(x,{cancelled:false}))},
  ktab(x){ui.ktab=x;render()},
  kst(x){const [id,v]=x.split(':');const o=orders.find(o=>o.id===id);write(Store.upd(id,{['st.'+me.station]:v,['t.'+me.station+'_'+v]:Date.now()}));
    if(v==='fertig'&&o)push(topicWaiter(o.waiter),'✅ '+t('Tisch')+' '+o.table+' – '+t(STN[me.station])+' '+t('fertig'),itemsText(o,me.station),['white_check_mark'])},
  pin(){if($('#pin').value===String(conf.pin)){ui.adminOk=true;render()}else toast(t('Falscher PIN'),'err')},
  atab(x){ui.atab=x;render();scrollTo(0,0)},
  addCat(){ui.draft.cats.push({id:uid(),name:t('Kategorie'),st:'kueche'});render()},
  delCat(x){if(!confirm(t('Löschen')+'?'))return;ui.draft.cats=ui.draft.cats.filter(c=>c.id!==x);ui.draft.items=ui.draft.items.filter(i=>i.cat!==x);render()},
  addItem(x){ui.draft.items.push({id:uid(),cat:x,name:'',price:0});render();const ins=document.querySelectorAll('[data-in="iname"]');ins[ins.length-1]?.focus()},
  delItem(x){ui.draft.items=ui.draft.items.filter(i=>i.id!==x);render()},
  dropDraft(){ui.draft=null;render()},
  loadMenu(){if(!confirm(t('Original-Speisekarte laden')+'?'))return;ui.draft=structuredClone(MENU);render()},
  saveMenu(){const d=ui.draft;d.items=d.items.filter(i=>i.name.trim());write(Store.saveConf({...conf,cats:d.cats,items:d.items}).then(()=>toast(t('Gespeichert'),'info',1500)));ui.draft=null},
  saveTables(){const tb=$('#tbl').value.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);write(Store.saveConf({...conf,tables:tb}).then(()=>toast(t('Gespeichert'),'info',1500)))},
  savePin(){write(Store.saveConf({...conf,pin:$('#newpin').value.trim()}).then(()=>toast(t('Gespeichert'),'info',1500)))},
  reset(){if(!confirm('?'))return;localStorage.removeItem('zb_cfg');location.reload()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.classList.contains('sheetbg')&&e.target!==b)return; // Klick im Sheet schließt nicht
  if(b.tagName==='BUTTON'&&document.activeElement&&document.activeElement!==document.body)document.activeElement.blur?.();
  A[b.dataset.a]?.(b.dataset.x,b,e)});
const IN={
  note(x,v){const l=cart.find(l=>l.key===x);if(l){l.note=v;saveCart()}},
  onote(x,v){ui.onote=v},
  name(x,v){me.name=v.trim();saveMe();renderHeader()},
  alertAll(x,v,el){me.alertAll=el.checked;saveMe()},
  wake(x,v,el){me.wake=el.checked;saveMe();wake(me.wake)},
  cname(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c)c.name=v},
  cst(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c)c.st=v},
  iname(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i)i.name=v},
  iprice(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i)i.price=parseFloat(v.replace(',','.'))||0}
};
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el)IN[el.dataset.in]?.(el.dataset.x,el.value,el)});

/* ============ Bildschirm anlassen (Küche) ============ */
let wl=null;async function wake(on){try{if(on&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen')}else{await wl?.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me.role==='kitchen'&&me.wake)wake(true)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.deferredInstall=e});

/* ============ Start ============ */
async function start(){render();if(!cfg)return;
  Store=cfg.mode==='fb'?FB:Demo;
  try{await Store.init()}catch(e){showErr(e);return}
  Store.subConf(c=>{conf=c;render()});start2()}
function start2(){if(!Store||!me.role)return render();prev=null;subDay=dayKey();Store.subOrders(onOrders)}
setInterval(()=>{if(Store&&me.role&&dayKey()!==subDay)start2();else if(!isEditing()&&!ui.sheet&&(me.role==='kitchen'||ui.wtab==='mine'))render()},30000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(me.role==='kitchen'&&me.wake)wake(true);
start();
</script>
</body>
