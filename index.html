*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.fa{font-family:Vazirmatn,system-ui,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--ln)}

.role{font-size:13px;color:var(--mu);background:var(--sf2);padding:3px 9px;border-radius:999px}

.dot{width:10px;height:10px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok)}.dot.off{background:var(--er)}
main{padding:14px 16px;max-width:1200px;margin:0 auto}
button,.btn{font:inherit;color:inherit;border:0;border-radius:12px;background:var(--sf2);padding:12px 14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.pri{background:var(--gd);color:#1a1406;font-weight:700}
.ok{background:var(--ok);color:#06200f;font-weight:700}
.wa{background:var(--wa);color:#2a1a00;font-weight:700}
.er{background:transparent;color:var(--er);border:1px solid var(--er)}
.ghost{background:transparent;border:1px solid var(--ln)}
.w{width:100%}
.ico{min-width:46px;padding:8px;font-size:20px;background:transparent}

.chip{white-space:nowrap;padding:8px 14px;min-height:40px;border-radius:999px}

.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav#tabs:empty{display:none}
nav#tabs button{flex:1;background:none;border-radius:0;min-height:64px;font-size:13px;padding:0 2px;color:var(--mu)}

.board{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.ocard{border-inline-start:6px solid var(--bl)}

.ohd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.tno{font-size:26px;font-weight:800}
.meta{color:var(--mu);font-size:14px}
.li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln);font-size:18px}
.li:last-child{border:0}
.li b{min-width:36px;color:var(--gd)}
.li.sm{font-size:15px;padding:4px 0}
.note{background:#3a2d10;color:#ffd98a;border-radius:8px;padding:3px 8px;font-size:15px;margin-top:4px;display:inline-block}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.st{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sf2)}

.row{display:flex;gap:10px;align-items:center}
.row>.f{flex:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts>*{flex:1 1 auto}
.sheetbg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetc{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;width:min(92vw,480px);pointer-events:none}
.toast{background:var(--ok);color:#06200f;font-weight:800;padding:14px 16px;border-radius:14px;box-shadow:0 10px 30px #000a;font-size:17px;pointer-events:auto}
.toast.info{background:var(--bl);color:#fff}.toast.err{background:var(--er);color:#fff}
h2{margin:6px 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:16px;color:var(--mu)}
.muted{color:var(--mu)}.sm{font-size:14px}
.qty{display:flex;align-items:center;gap:6px}.qty button{min-width:44px;padding:6px}
.qty span{min-width:26px;text-align:center;font-weight:800}
.big{font-size:22px;font-weight:800}
.stack>*+*{margin-top:10px}
code{background:var(--sf2);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.pinw{max-width:320px;margin:40px auto}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.seg{display:flex;background:var(--sf);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;background:none}

.edrow{display:grid;grid-template-columns:1fr 92px 46px;gap:6px;margin-top:6px}
.strike{text-decoration:line-through;opacity:.55}

.zone{margin:18px 0 8px;color:var(--gd);font-weight:700;font-size:15px;letter-spacing:.3px;display:flex;justify-content:space-between}
.tb{height:74px;flex-direction:column;gap:2px;font-size:20px;font-weight:800;position:relative;background:var(--sf);border:1px solid var(--ln)}
.tb.occ{border-color:var(--gd);background:#1f2a20}
.tb .eur{font-size:12px;font-weight:600;color:var(--gd)}
.tb .bd{position:absolute;top:5px;inset-inline-end:5px;display:flex;gap:3px}
.tb .bd i{font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.bp{background:var(--wa);color:#2a1a00}.bc{background:var(--er);color:#fff}.br{background:var(--ok);color:#06200f}
.item.off{opacity:.38;pointer-events:none}

.gst{margin-top:10px;border-top:1px dashed var(--ln);padding-top:8px}

.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
.call{background:#3a1416;border:1px solid var(--er)}
.pend{border-inline-start:6px solid var(--wa)}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--sf2);border:1px solid var(--ln);flex:none;padding:0;min-height:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--mu);transition:.15s}
.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on::after{inset-inline-start:25px;background:#fff}
.avrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}

.wd{display:flex;gap:6px;flex-wrap:wrap}.wd button{min-height:38px;padding:6px 12px}

.schema{width:100%;max-width:420px;display:block;margin:4px auto 6px}.sl{font:600 11px system-ui;fill:#eef2ef}.ss{font:10px system-ui;fill:#93a39c}.sd{font:800 11px system-ui;fill:#1a1406}
.stage{padding:6px 4px 18px}.stage.tilt{perspective:900px}
.floor{position:relative;aspect-ratio:16/10;border-radius:18px;background:repeating-linear-gradient(45deg,#1b2622 0 14px,#1e2a26 14px 28px);border:1px solid var(--ln);touch-action:none}
.stage.tilt .floor{transform:rotateX(34deg);transform-origin:50% 100%;box-shadow:0 26px 36px #000b}
.floor .fl{position:absolute;left:12px;top:8px;font-size:12px;color:var(--mu)}
.ptb{position:absolute;transform:translate(-50%,-50%);width:15%;min-width:44px;aspect-ratio:1;min-height:0;padding:0;border-radius:12px;background:#33443e;border:1px solid #4a5d56;box-shadow:0 7px 0 #0e1512,0 10px 14px #0008;font-weight:900;font-size:17px;flex-direction:column;gap:0;touch-action:none}
.ptb small{font-size:9px;font-weight:700;color:#1a1406}
.ptb.po{background:var(--gd);color:#1a1406}.ptb.pp{background:var(--wa);color:#2a1a00;animation:pul 1.2s infinite}.ptb.pc{background:var(--er);color:#fff;animation:pul .8s infinite}.ptb.pr{background:var(--ok);color:#06200f}
.ptb.drag{outline:3px solid #fff;z-index:5}
.ptb:active{transform:translate(-50%,-50%) scale(.94)}
@keyframes pul{50%{filter:brightness(1.35)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mu);margin-top:6px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

#alarm.on{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:abl 1s steps(1) infinite}
#alarm.a-call{--ac:#b3121a}#alarm.a-new{--ac:#c76a00}#alarm.a-ready{--ac:#13843f}
@keyframes abl{0%{background:var(--ac)}50%{background:#000}}
.alw{width:100%;max-width:520px;text-align:center;color:#fff}
.ali{background:rgba(0,0,0,.55);border-radius:16px;padding:16px;margin-bottom:12px}
.alm{font-size:28px;font-weight:900;line-height:1.2}.alb{font-size:17px;margin-top:8px;opacity:.95}
.alok{width:100%;min-height:76px;font-size:26px;font-weight:900;background:#fff;color:#000;border-radius:18px;margin-top:8px}
.shiftc{max-width:520px;margin:30px auto;text-align:center}
.shiftc .big{font-size:26px}
.duty{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}.duty span{flex:1}
</style>

function sound(kind){if(!AC)return;const n=AC.currentTime;
  const seq=kind==='ready'?[[880,0],[1175,.16],[1568,.32],[1568,.6]]:kind==='call'?[[988,0],[740,.2],[988,.4],[740,.6]]:[[660,0],[880,.22],[660,.5],[880,.72]];
  for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.6,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+.28);
    o.connect(g);g.connect(AC.destination);o.start(n+d);o.stop(n+d+.3)}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function notify(title,body){try{if(!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;
  const r=await navigator.serviceWorker?.getRegistration();if(r)r.showNotification(title,{body,tag:uid(),vibrate:[300,100,300],icon:'icon-192.png'});else new Notification(title,{body})}catch(e){}}
function toast(msg,kind='',ms=4500){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;d.onclick=()=>d.remove();$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
function alert2(kind,msg,body,cls,key){if(!onShift())return;notify(msg,body||'');
  const k=key||msg;if(!alarms.some(a=>a.k===k))alarms.push({k,kind,msg,body:body||'',at:Date.now()});ring();renderAlarm()}
function ring(){if(!alarms.length){clearInterval(alarmT);alarmT=null;return}const k=alarms[alarms.length-1].kind;sound(k);vib(k==='ready'?[400,150,400,150,700]:[300,120,300,120,300]);
  if(!alarmT)alarmT=setInterval(()=>{if(!alarms.length){clearInterval(alarmT);alarmT=null;return}const k=alarms[alarms.length-1].kind;sound(k);vib([300,120,300])},3000)}
function renderAlarm(){const el=$('#alarm');if(!alarms.length){el.innerHTML='';el.className='';return}
  const k=alarms.some(a=>a.kind==='call'||a.kind==='esc')?'a-call':alarms.some(a=>a.kind==='new')?'a-new':'a-ready';
  el.className='on '+k;el.innerHTML=`<div class="alw">${alarms.slice(-5).reverse().map(a=>`<div class="ali"><div class="alm">${esc(a.msg)}</div>${a.body?`<div class="alb">${esc(a.body).replace(/\n/g,'<br>')}</div>`:''}</div>`).join('')}
   ${alarms.length>5?`<div class="alb">+${alarms.length-5}</div>`:''}<button class="alok" data-a="seen">${t('Gesehen')} ✓</button></div>`}

function onOrders(list){
  const first=prevO===null,np=new Map();
  for(const o of list){np.set(o.id,o);if(first)continue;const p=prevO.get(o.id);
    if(me.role==='kitchen'){const s=me.station;
      const nowNew=valid(o)&&o.st?.[s]==='neu', wasNew=p&&valid(p)&&p.st?.[s];
      if(nowNew&&!wasNew){ui.seen.add(o.id);alert2('new','🔔 '+t('Neue Bestellung')+' – '+t('Tisch')+' '+o.table,itemsText(o,s),'info','k'+o.id)}
      if(p&&!p.cancelled&&o.cancelled&&o.st?.[s])toast('✖ '+t('Tisch')+' '+o.table+' – '+t('Storniert'),'err',8000)}
    if(me.role==='waiter'){
      if(o.status==='pending'&&!o.cancelled&&(!p||p.status!=='pending'))alert2('new','🧾 '+t('Neue Gastbestellung')+' – '+t('Tisch')+' '+o.table,itemsText(o),'info','o'+o.id);
      if(o.status==='pending'&&!o.cancelled&&o.escMs&&p&&!p.escMs)alert2('esc','⚠ '+t('Tisch')+' '+o.table+' '+t('wartet seit 2 Min.'),itemsText(o),'err','e'+o.id);
      if(p&&p.status==='pending'&&o.status!=='pending')dropAlarm('o'+o.id,'e'+o.id);
      if(me.alertAll||norm(o.waiter)===norm(me.name))for(const s of Object.keys(o.st||{}))if(o.st[s]==='fertig'&&p?.st?.[s]!=='fertig')
        alert2('ready','✅ '+t('Tisch')+' '+o.table+' – '+t(STN[s])+' '+t('fertig'),itemsText(o,s),'','r'+o.id+s)}
  }
  prevO=np;orders=list;render()}
function onCalls(list){
  const first=prevC===null,np=new Map();
  for(const c of list){np.set(c.id,c);if(first||me.role!=='waiter')continue;const p=prevC.get(c.id);
    if(!c.done&&!p)alert2('call',(c.type==='bill'?'🧾 ':'🙋 ')+t('Tisch')+' '+c.table+' – '+t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'','err','c'+c.id);
    if(!c.done&&c.escMs&&p&&!p.escMs)alert2('esc','⚠ '+t('Tisch')+' '+c.table+' '+t('wartet seit 2 Min.'),t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'err','ce'+c.id);
    if(c.done&&p&&!p.done)dropAlarm('c'+c.id,'ce'+c.id)}
  prevC=np;calls=list;render()}

function dropAlarm(...ks){const n=alarms.length;alarms=alarms.filter(a=>!ks.includes(a.k));if(alarms.length!==n){renderAlarm();if(!alarms.length)ring()}}
/* Eskalation: nach 2 Min. unbestätigt -> alle Kellner */
const ESC_MS=120000;
function escalate(){if(me.role!=='waiter'||!onShift()||!Store)return;const now=Date.now();
  for(const o of pendingOf())if(!o.escMs&&now-o.createdMs>ESC_MS){o.escMs=now;write(Store.updDoc('orders/'+o.id,{escMs:now}));
    alert2('esc','⚠ '+t('Tisch')+' '+o.table+' '+t('wartet seit 2 Min.'),itemsText(o),'err','e'+o.id);
    pushShift(cfg,shifts,s=>s.role==='waiter',topicService(),'⚠ Tisch '+o.table+' wartet seit 2 Min.','Gastbestellung noch nicht bestätigt',['warning'])}
  for(const c of openCalls())if(!c.escMs&&now-c.createdMs>ESC_MS){c.escMs=now;write(Store.updDoc('calls/'+c.id,{escMs:now}));
    alert2('esc','⚠ '+t('Tisch')+' '+c.table+' '+t('wartet seit 2 Min.'),t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'err','ce'+c.id);
    pushShift(cfg,shifts,s=>s.role==='waiter',topicService(),'⚠ Tisch '+c.table+' wartet seit 2 Min.',c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen',['warning'])}}
setInterval(escalate,15000);
/* ============ Rendering ============ */
const isEditing=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#main,#sheet')};
addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!isEditing()){pending=false;render()}},50));
function renderHeader(){
  const rl=me.role==='waiter'?t('Service')+(me.name?' · '+esc(me.name):''):me.role==='kitchen'?STI[me.station]+' '+t(STN[me.station]):me.role==='admin'?t('Admin'):'';
  $('#hdr').innerHTML=`<span class="brand"><img src="logo.png" alt="Zirlerberg" class="hlogo"><span class="ver">v10</span></span>${rl?`<span class="role">${rl}</span>`:''}<span class="sp"></span>
   <span class="dot ${connected?'on':'off'}"></span>${me.role?`<button class="ico" data-a="settings">⚙︎</button>`:''}`}
function render(){
  document.documentElement.lang=me.lang;document.documentElement.dir=me.lang==='fa'?'rtl':'ltr';document.body.classList.toggle('fa',me.lang==='fa');
  renderHeader();
  if(isEditing()){pending=true;return}
  let main='',tabs='',bar='';
  if(cfg.mode==='fb'&&!acc.checked)main=loadingView();
  else if(cfg.mode==='fb'&&!acc.staff&&!acc.admin)main=codeView();
  else if(!me.role||(me.role==='admin'&&cfg.mode==='fb'&&!acc.admin))main=roleView();
  else if(!conf)main=loadingView();
  else if((me.role==='waiter'||me.role==='kitchen')&&!staffActive(conf))main=closedView();
  else if((me.role==='waiter'||me.role==='kitchen')&&!onShift())main=startShiftView();
  else if(me.role==='waiter')[main,tabs,bar]=waiterView();
  else if(me.role==='kitchen')[main,tabs]=kitchenView();
  else if(me.role==='admin')[main,tabs]=adminView();
  $('#main').innerHTML=main;$('#tabs').innerHTML=tabs;$('#cartbar').innerHTML=bar;
  $('#sheet').innerHTML=ui.sheet?`<div class="sheetbg" data-a="closeSheet"><div class="sheetc">${sheetView()}</div></div>`:'';
}
function closedView(){const n=nextOpen(conf);const wd=n?(n.inDays===0?t('heute'):n.inDays===1?t('morgen'):t(WD[n.d.getDay()])):'';
  return `<div class="shiftc"><div style="font-size:60px">🌙</div><h2>${t('Geschlossen')}</h2>${n?`<p class="muted">${t('Öffnet')} ${esc(wd)} ${t('um')} ${esc(n.o)} · ${t('App aktiv ab')} ${esc(minus30(n.o))}</p>`:''}
  <p class="muted sm">${t('Außerhalb der Arbeitszeit kommen keine Benachrichtigungen.')}</p></div>`}
const minus30=s=>{let [a,b]=s.split(':').map(Number);let m=a*60+b-30;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function startShiftView(){const r=me.role==='waiter'?'🧾 '+t('Service'):STI[me.station]+' '+t(STN[me.station]);
  return `<div class="shiftc"><div style="font-size:56px">👋</div><h2>${t('Hallo')} ${esc(me.name||'')}</h2><p class="muted">${r}</p>
  <button class="w pri big" style="min-height:84px;margin-top:16px" data-a="shiftStart">▶ ${t('Schicht beginnen')}</button>
  <p class="muted sm" style="margin-top:14px">${t('Erst nach Schichtbeginn bekommst du Bestellungen und Alarme.')}</p>
  <button class="w ghost" style="margin-top:20px" data-a="changeRole">${t('Rolle wechseln')}</button></div>`}
function roleView(){return `<div class="stack" style="max-width:560px;margin:auto"><h2>${t('Wer bist du?')}</h2>
 <div class="seg"><button data-a="lang" data-x="de" class="${me.lang==='de'?'act':''}">Deutsch</button><button data-a="lang" data-x="fa" class="${me.lang==='fa'?'act':''}">فارسی</button></div>
 <label>${t('Dein Name')}</label><input id="nm" value="${esc(me.name)}" autocomplete="off">
 <button class="w pri big" style="min-height:70px" data-a="role" data-x="waiter">🧾 ${t('Service')}</button>
 <div class="card"><label style="margin-top:0">${t('Station')}</label>
  <div class="grid" style="grid-template-columns:repeat(3,1fr)">${Object.keys(STN).map(s=>`<button class="big" style="min-height:70px" data-a="role" data-x="kitchen:${s}">${STI[s]}<br><span class="sm">${t(STN[s])}</span></button>`).join('')}</div></div>
 ${cfg.mode!=='fb'||acc.admin?`<button class="w ghost" data-a="role" data-x="admin">⚙︎ ${t('Admin')}</button>`:''}
 ${cfg.mode==='demo'?'<p class="muted sm">Demo</p>':`<button class="w ghost sm" data-a="demo">${t('Demo testen (nur dieses Gerät)')}</button>`}<p class="sig">This app was created and inspired by Hamid</p></div>`}

/* ----- Service ----- */
function waiterView(){
  const nAct=openCalls().length+pendingOf().length+orders.filter(o=>hasReady(o)&&(me.alertAll||norm(o.waiter)===norm(me.name))).length;
  const tabs=`<button data-a="wtab" data-x="tische" class="${ui.wtab==='tische'&&!ui.order?'act':''}">🗺 ${t('Tische')}</button>
   <button data-a="wtab" data-x="aktiv" class="${ui.wtab==='aktiv'&&!ui.order?'act':''}">🔔 ${t('Aktiv')} ${nAct?`<span class="badge">${nAct}</span>`:''}</button>`;
  if(ui.order)return orderView(tabs);
  if(ui.wtab==='aktiv')return [aktivView(),tabs,''];
  let m='';
  if(ui.tview==='plan')return [planView(false),tabs,''];
  m+=`<div class="seg" style="margin-bottom:4px"><button data-a="tview" data-x="list" class="act">▦ ${t('Liste')}</button><button data-a="tview" data-x="plan">🗺 ${t('Plan')}</button></div>`;
  for(const z of zonesOf(conf)){const ts=(z.tables||[]).map(String);if(!ts.length)continue;
    const zt=ts.reduce((a,x)=>a+tableTotal(x),0);
    m+=`<div class="zone"><span>${esc(z.name)}</span>${zt?`<span>${eur(zt)}</span>`:''}</div><div class="grid tables">${ts.map(x=>{const s=sessOf(x),sum=tableTotal(x),np=pendingOf(x).length,nc=openCalls(x).length,nr=tableOrders(x).filter(hasReady).length;
      return `<button class="tb ${s?'occ':''}" data-a="table" data-x="${x}">${esc(x)}${sum?`<span class="eur">${eurT(sum)}</span>`:''}<span class="bd">${np?`<i class="bp">${np}</i>`:''}${nc?`<i class="bc">!</i>`:''}${nr?`<i class="br">✓</i>`:''}</span></button>`}).join('')}</div>`}
  return [m,tabs,''];
}
function orderLines(o,showSt=true){return o.items.map(i=>`<div class="li sm ${showSt&&o.st?.[i.st]==='abgeholt'?'strike':''}"><b>${i.qty}×</b><div class="f" style="flex:1">${esc(i.name)}${i.note?`<br><span class="note">${esc(i.note)}</span>`:''}</div><span class="muted">${eur(i.qty*i.price)}</span></div>`).join('')}
function stChips(o){return `<div class="sts">${Object.entries(o.st||{}).map(([s,v])=>`<span class="st ${v}">${STI[s]} ${t(STN[s])}: ${t(STL[v])}</span>`).join('')}</div>`}
function pendCard(o){return `<div class="card pend" style="margin-bottom:10px"><div class="ohd"><span class="tno">${t('Tisch')} ${esc(o.table)}</span><span class="meta">${hhmm(o.createdMs)} · 👤 ${esc(guestLabeler(tableOrders(o.table))(o))}</span></div>
  ${orderLines(o,false)}${o.note?`<span class="note">${esc(o.note)}</span>`:''}
  <div class="acts"><button class="er" data-a="decline" data-x="${o.id}">${t('Ablehnen')}</button><button class="ok" style="flex:2" data-a="confirm" data-x="${o.id}">✓ ${t('Bestätigen')}</button></div></div>`}
function aktivView(){
  const cl=openCalls().sort((a,b)=>a.createdMs-b.createdMs),pe=pendingOf().sort((a,b)=>a.createdMs-b.createdMs);
  const rd=orders.filter(o=>hasReady(o)&&(me.alertAll||norm(o.waiter)===norm(me.name)));
  let m='';
  if(cl.length)m+=`<h3>${t('Rufe')}</h3>`+cl.map(c=>`<div class="card call row" style="margin-bottom:8px"><div class="f"><b>${t('Tisch')} ${esc(c.table)}</b> · ${c.type==='bill'?'🧾 '+t('Rechnung gewünscht'):'🙋 '+t('Kellner gerufen')}<div class="meta">${hhmm(c.createdMs)} · ${mins(c.createdMs)} ${t('Min.')}</div></div><button class="ok" data-a="callDone" data-x="${c.id}">✓ ${t('erledigt')}</button></div>`).join('');
  if(pe.length)m+=`<h3>${t('Gastbestellungen')}</h3>`+pe.map(pendCard).join('');
  if(rd.length)m+=`<h3>${t('Abholbereit')}</h3>`+rd.map(o=>`<div class="card ocard ready" style="margin-bottom:8px"><div class="ohd"><span class="tno">${t('Tisch')} ${esc(o.table)}</span><span class="meta">${esc(o.guestName||o.waiter||'')}</span></div>${stChips(o)}
    <div class="acts">${Object.entries(o.st).filter(([,v])=>v==='fertig').map(([s])=>`<button class="ok" data-a="pickup" data-x="${o.id}:${s}">✓ ${STI[s]} ${t(STN[s])} ${t('abgeholt')}</button>`).join('')}</div></div>`).join('');
  return m||`<p class="empty">${t('Nichts zu tun 👍')}</p>`}
function orderView(tabs){
  const cats=conf.cats.filter(c=>conf.items.some(i=>i.cat===c.id));
  if(!cats.find(c=>c.id===ui.cat))ui.cat=cats[0]?.id;
  const q={};for(const l of cart)q[l.itemId]=(q[l.itemId]||0)+l.qty;
  const n=cart.reduce((a,l)=>a+l.qty,0),sum=cart.reduce((a,l)=>a+l.qty*l.price,0);
  const main=`<div class="row"><button class="ghost" style="flex:none" data-a="endOrder">←</button><div class="f"><span class="muted">${t('Tisch')}</span> <span class="big">${esc(ui.order)}</span></div></div>
   <div class="chips">${cats.map(c=>`<button class="chip ${c.id===ui.cat?'act':''}" data-a="cat" data-x="${c.id}">${STI[c.st]||''} ${esc(c.name)}</button>`).join('')}</div>
   <div class="grid items">${conf.items.filter(i=>i.cat===ui.cat).map(i=>{const ok=avail(i);return `<button class="item ${ok?'':'off'}" data-a="add" data-x="${i.id}"><span>${esc(i.name)}</span><span class="p">${ok?eur(i.price):`<span class="off-l">${t('heute aus')}</span>`}</span>${q[i.id]?`<span class="q">${q[i.id]}</span>`:''}</button>`}).join('')}</div>`;
  const bar=n?`<button class="w pri" data-a="openCart">🧾 ${t('Warenkorb')} · ${n} ${t('Artikel')} · ${eur(sum)}</button>`:'';
  return [main,tabs,bar]}
function guestLabeler(list){const num={};let n=0;for(const o of [...list].sort((a,b)=>a.createdMs-b.createdMs))if(o.source==='guest'&&!o.guestName&&o.guestId&&!(o.guestId in num))num[o.guestId]=++n;
  return o=>o.guestName||(o.source==='guest'?t('Gast')+' '+(num[o.guestId]||''):t('Service'))}
function tableSheet(tb){
  const z=zoneOf(tb),os=tableOrders(tb).filter(o=>!o.cancelled&&o.status!=='declined'),cl=openCalls(tb),pe=os.filter(o=>o.status==='pending'),ok=os.filter(o=>o.status!=='pending');
  const gl=guestLabeler(os);const groups={};for(const o of ok){const g=gl(o);(groups[g]??=[]).push(o)}
  return `<div class="row"><h2 class="f">${t('Tisch')} ${esc(tb)} <span class="muted sm">${z?esc(z.name):''}</span></h2><button class="ico" data-a="closeSheet">✕</button></div>
  ${cl.map(c=>`<div class="card call row" style="margin-bottom:8px"><div class="f">${c.type==='bill'?'🧾 '+t('Rechnung gewünscht'):'🙋 '+t('Kellner gerufen')} · ${hhmm(c.createdMs)}</div><button class="ok" data-a="callDone" data-x="${c.id}">✓</button></div>`).join('')}
  ${pe.map(pendCard).join('')}
  ${Object.entries(groups).map(([g,list])=>`<div class="gst"><h4><span>👤 ${esc(g)}</span><span>${eur(list.reduce((a,o)=>a+tot(o),0))}</span></h4>${list.map(o=>stChips(o)+orderLines(o)).join('')}</div>`).join('')}
  ${!os.length?`<p class="muted">${t('frei')}</p>`:''}
  <div class="sum"><span>${t('Gesamt')}</span><span>${eur(tableTotal(tb))}</span></div>
  <div class="acts"><button class="pri" style="flex:2" data-a="startOrder" data-x="${esc(tb)}">➕ ${t('Bestellung aufnehmen')}</button>${ok.length?`<button data-a="splitOpen" data-x="${esc(tb)}">✂ ${t('Getrennt zahlen')}</button>`:''}</div>
  ${sessOf(tb)?`<button class="w ghost" style="margin-top:10px" data-a="closeTable" data-x="${esc(tb)}">💶 ${t('Tisch abschließen (bezahlt)')}</button>`:''}`}
const PC=['#c9a45c','#4ea1ff','#2fbf71','#e5484d','#b07cff','#f0a92b','#3fd0c9','#ff7ab6'];
const LET='ABCDEFGH';
function splitUnits(tb){const os=tableOrders(tb).filter(valid).sort((a,b)=>a.createdMs-b.createdMs),gl=guestLabeler(tableOrders(tb));const u=[];
  for(const o of os)o.items.forEach((i,ix)=>{for(let q=0;q<i.qty;q++)u.push({k:o.id+':'+ix+':'+q,name:i.name,price:+i.price,g:gl(o)})});return u}
function splitInit(tb){const u=splitUnits(tb);const gs=[...new Set(u.map(x=>x.g))];const payers=gs.slice(0,8).map((g,i)=>({id:LET[i],label:g}));if(!payers.length)payers.push({id:'A',label:''});
  const assign={};for(const x of u){const p=payers.find(p=>p.label===x.g);if(p)assign[x.k]=p.id}
  ui.split={tb,payers,assign,active:payers[0].id}}
function splitSheet(){const S=ui.split,u=splitUnits(S.tb);const col=id=>PC[LET.indexOf(id)%PC.length];
  const sumOf=id=>u.filter(x=>S.assign[x.k]===id).reduce((a,x)=>a+x.price,0);const rest=u.filter(x=>!S.assign[x.k]);
  return `<div class="row"><h2 class="f">✂ ${t('Getrennt zahlen')} · ${t('Tisch')} ${esc(S.tb)}</h2><button class="ico" data-a="splitBack">✕</button></div>
  <p class="muted sm">${t('Zahler antippen, dann Artikel antippen, um sie zuzuordnen. Wer zusammen zahlt, bekommt denselben Buchstaben.')}</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${S.payers.map(p=>`<button class="ghost" data-a="splitAct" data-x="${p.id}" style="flex-direction:column;align-items:stretch;border:2px solid ${S.active===p.id?col(p.id):'var(--ln)'};${S.active===p.id?'background:var(--sf2)':''}">
    <span style="display:flex;justify-content:space-between"><b style="color:${col(p.id)};font-size:20px">${p.id}</b><b>${eur(sumOf(p.id))}</b></span><span class="muted sm" style="text-align:start">${esc(p.label||'')}</span></button>`).join('')}
    ${S.payers.length<8?`<button class="ghost" data-a="splitAdd">＋ ${t('Zahler')}</button>`:''}</div>
  <div class="card" style="margin-top:12px;padding:4px 12px">${u.map(x=>{const a=S.assign[x.k];return `<div class="avrow" data-a="splitTap" data-x="${esc(x.k)}" style="cursor:pointer">

async function start(){render();

  setConn(true);addEventListener('online',()=>setConn(true));addEventListener('offline',()=>setConn(false));
  if(cfg.mode!=='fb'){acc={checked:true,staff:true,admin:true};startData();return}
  const u=Store.authUid(),seen={};
  if(accC&&accC.uid===u&&(acc.staff||acc.admin))startData();else if(accC&&accC.uid!==u){acc={checked:false,staff:false,admin:false};render()}
  const upd=()=>{if(!('a' in seen&&'s' in seen))return;acc.checked=true;LS.set('zb_acc',{uid:u,staff:acc.staff,admin:acc.admin});
    if((acc.staff||acc.admin)&&!dataOn)startData();

    render()};
  Store.subDoc('admins/'+u,d=>{if(d===undefined)return;seen.a=1;acc.admin=!!d;upd()},()=>{seen.a=1;upd()});
  Store.subDoc('staff/'+u,d=>{if(d===undefined)return;seen.s=1;acc.staff=!!d;upd()},()=>{seen.s=1;upd()});

function startData(){dataOn=true;
  Store.subDoc('config/main',c=>{if(c===undefined)return;

    const mg=migrate(c);if(mg){if(acc.admin)write(Store.setDoc('config/main',C0(mg)));conf=mg;LS.set('zb_conf',C0(mg))}else{conf=c;LS.set('zb_conf',C0(c));if(acc.admin&&c.pin!==undefined)write(Store.setDoc('config/main',C0(c)))}render()},showErr);
  Store.subDoc('config/today',d=>{if(d===undefined)return;today=d;LS.set('zb_today',d);render()},showErr);
  Store.subDoc('config/templates',d=>{if(d===undefined)return;templates=d||{};render()},showErr);
  Store.subCol('tables',null,null,l=>{tables={};for(const x of l)tables[x.id]=x;render()},showErr);
  subToday()}
setInterval(()=>{if(!dataOn)return;if(onShift()&&conf&&!staffActive(conf))A.shiftEnd('auto');if(Store&&dayKey()!==subDay)subToday();else if(!isEditing()&&!ui.sheet&&(me.role==='kitchen'||ui.wtab==='aktiv'))render()},30000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{});
if(me.role==='kitchen'&&me.wake)wake(true);
start();
</script>
