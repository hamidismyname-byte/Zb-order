let AC=null;
addEventListener('pointerdown',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{capture:true});
function sound(kind){if(!AC)return;const n=AC.currentTime;
  const seq=kind==='ready'?[[880,0],[1175,.16],[1568,.32],[1568,.6]]:kind==='call'?[[988,0],[740,.2],[988,.4],[740,.6]]:[[660,0],[880,.22],[660,.5],[880,.72]];
  for(const [f,d] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.6,n+d+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d+.28);
    o.connect(g);g.connect(AC.destination);o.start(n+d);o.stop(n+d+.3)}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function notify(title,body){try{if(!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;
  const r=await navigator.serviceWorker?.getRegistration();if(r)r.showNotification(title,{body,tag:uid(),vibrate:[300,100,300],icon:'icon-192.png'});else new Notification(title,{body})}catch(e){}}
function toast(msg,kind='',ms=4500){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;d.onclick=()=>d.remove();$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
function alert2(kind,msg,body,cls){sound(kind);vib(kind==='ready'?[400,150,400,150,700]:[200,100,200,100,200]);toast(msg,cls,8000);notify(msg,body||'')}

function onOrders(list){
  const first=prevO===null,np=new Map();
  for(const o of list){np.set(o.id,o);if(first)continue;const p=prevO.get(o.id);
    if(me.role==='kitchen'){const s=me.station;
      const nowNew=valid(o)&&o.st?.[s]==='neu', wasNew=p&&valid(p)&&p.st?.[s];
      if(nowNew&&!wasNew){ui.seen.add(o.id);alert2('new','🔔 '+t('Neue Bestellung')+' – '+t('Tisch')+' '+o.table,itemsText(o,s),'info')}
      if(p&&!p.cancelled&&o.cancelled&&o.st?.[s])toast('✖ '+t('Tisch')+' '+o.table+' – '+t('Storniert'),'err',8000)}
    if(me.role==='waiter'){
      if(o.status==='pending'&&!o.cancelled&&(!p||p.status!=='pending'))alert2('new','🧾 '+t('Neue Gastbestellung')+' – '+t('Tisch')+' '+o.table,itemsText(o),'info');
      if(me.alertAll||norm(o.waiter)===norm(me.name))for(const s of Object.keys(o.st||{}))if(o.st[s]==='fertig'&&p?.st?.[s]!=='fertig')
        alert2('ready','✅ '+t('Tisch')+' '+o.table+' – '+t(STN[s])+' '+t('fertig'),itemsText(o,s))}
  }
  prevO=np;orders=list;render()}
function onCalls(list){
  const first=prevC===null,np=new Map();
  for(const c of list){np.set(c.id,c);if(!first&&me.role==='waiter'&&!c.done&&!prevC.has(c.id))
    alert2('call',(c.type==='bill'?'🧾 ':'🙋 ')+t('Tisch')+' '+c.table+' – '+t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'','err')}
  prevC=np;calls=list;render()}

function renderHeader(){

  $('#hdr').innerHTML=`<span class="brand">ZIRLERBERG <span style="font-size:10px;opacity:.5">v8</span></span>${rl?`<span class="role">${rl}</span>`:''}<span class="sp"></span>
   <span class="dot ${connected?'on':'off'}"></span>${me.role?`<button class="ico" data-a="settings">⚙︎</button>`:''}`}
function render(){
  document.documentElement.lang=me.lang;document.documentElement.dir=me.lang==='fa'?'rtl':'ltr';document.body.classList.toggle('fa',me.lang==='fa');
  renderHeader();
  if(isEditing()){pending=true;return}
  let main='',tabs='',bar='';
  if(cfg.mode==='fb'&&!acc.checked)main=`<p class="empty">${t('Laden…')}</p>`;
  else if(cfg.mode==='fb'&&!acc.staff&&!acc.admin)main=codeView();
  else if(!me.role||(me.role==='admin'&&cfg.mode==='fb'&&!acc.admin))main=roleView();
  else if(!conf)main=`<p class="empty">${t('Laden…')}</p>`;
  else if(me.role==='waiter')[main,tabs,bar]=waiterView();
  else if(me.role==='kitchen')[main,tabs]=kitchenView();
  else if(me.role==='admin')[main,tabs]=adminView();
  $('#main').innerHTML=main;$('#tabs').innerHTML=tabs;$('#cartbar').innerHTML=bar;
  $('#sheet').innerHTML=ui.sheet?`<div class="sheetbg" data-a="closeSheet"><div class="sheetc">${sheetView()}</div></div>`:'';
}

function waiterView(){

  let m='';

}

 <p class="muted sm">${t('Einmalig pro Handy: Zugangscode vom Chef eingeben.')}</p>
 <div class="seg"><button data-a="lang" data-x="de" class="${me.lang==='de'?'act':''}">Deutsch</button><button data-a="lang" data-x="fa" class="${me.lang==='fa'?'act':''}">فارسی</button></div>
 <label>${t('Dein Name')}</label><input id="nm" value="${esc(me.name)}" autocomplete="off">
 <label>${t('Zugangscode')}</label><input id="acode" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:2px">
 <button class="w pri big" data-a="unlock">${t('Freischalten')}</button></div>`}
function devicesCard(){if(cfg.mode!=='fb')return '';
 const row=(d,k)=>`<div class="avrow"><span>${k==='admins'?'⚙︎':'🧾'} ${esc(d.name||'–')} <span class="muted sm">${d.at?new Date(d.at).toLocaleDateString('de-AT'):''}${d.id===Store.authUid()?' · '+t('dieses Gerät'):''}</span></span>${d.id===Store.authUid()?'':`<button class="ghost sm" data-a="delDev" data-x="${k}/${d.id}">✕</button>`}</div>`;
 return `<div class="card" style="margin-top:12px"><b>🔒 ${t('Freigeschaltete Geräte')}</b><p class="muted sm">${t('Verlorenes Handy oder Ex-Mitarbeiter? Hier entfernen.')}</p>
 ${devs.admins.map(d=>row(d,'admins')).join('')}${devs.staff.map(d=>row(d,'staff')).join('')}</div>`}
const A={
  lang(x){me.lang=x;saveMe();render()},
  demo(){cfg={mode:'demo',topic:'',ntfy:'https://ntfy.sh'};LS.set('zb_cfg',cfg);location.reload()},
  role(x){const nm=$('#nm').value.trim();me.name=nm;
    if(x==='waiter'&&!nm){toast(t('Bitte Namen eingeben'),'err');$('#nm').focus();return}
    if(x.startsWith('kitchen')){me.role='kitchen';me.station=x.split(':')[1];ui.ktab='open'}else me.role=x;
    saveMe();prevO=null;prevC=null;render();if(me.role==='kitchen'&&me.wake)wake(true)},
  settings(){ui.sheet='settings';render()},
  closeSheet(){ui.sheet=null;render()},
  changeRole(){me.role=null;saveMe();ui.sheet=null;ui.adminOk=false;wake(false);render()},
  async perm(){try{await Notification.requestPermission()}catch(e){}render()},
  async install(){ui.deferredInstall?.prompt();ui.deferredInstall=null;render()},
  copy(x){navigator.clipboard?.writeText(x).then(()=>toast(t('Kopiert'),'info',1500)).catch(()=>prompt('',x))},
  wtab(x){ui.wtab=x;ui.order=null;saveCart();render();scrollTo(0,0)},
  table(x){ui.sheet='table';ui.sheetArg=x;render()},
  startOrder(x){ui.order=x;ui.sheet=null;if(cart.length&&LS.get('zb_order_table')!==x){cart=[]}saveCart();render();scrollTo(0,0)},
  endOrder(){ui.order=null;saveCart();render()},
  cat(x){ui.cat=x;render()},
  add(x){const it=conf.items.find(i=>i.id===x);if(!it||!avail(it))return;const st=catOf(it)?.st||'kueche';
    const l=cart.find(l=>l.itemId===x&&!l.note);if(l)l.qty++;else cart.push({key:uid(),itemId:x,name:it.name,price:+it.price,st,qty:1,note:''});vib(15);saveCart();render()},
  openCart(){ui.sheet='cart';render()},
  qty(x){const [k,d]=x.split(':');const l=cart.find(l=>l.key===k);if(!l)return;l.qty+=+d;if(l.qty<=0)cart=cart.filter(c=>c!==l);saveCart();if(!cart.length)ui.sheet=null;render()},
  clearCart(){cart=[];ui.onote='';ui.sheet=null;saveCart();render()},
  async send(){if(!cart.length||!ui.order)return;const tb=ui.order;
    const items=cart.map(({name,price,qty,note,st,itemId})=>({name,price,qty,note:note.trim(),st,itemId}));
    const st={};for(const i of items)st[i.st]='neu';
    const note=ui.onote.trim();cart=[];ui.onote='';ui.sheet=null;ui.order=null;saveCart();render();
    try{const session=await Store.claimSession(tb);
      const o={id:uid(),day:dayKey(),createdMs:Date.now(),confirmedMs:Date.now(),table:tb,session,waiter:me.name,source:'staff',status:'ok',note,cancelled:false,st,items};
      await Store.setDoc('orders/'+o.id,o);
      for(const s of Object.keys(st))push(cfg,topicStation(s),'🔔 '+t('Neue Bestellung')+' – '+t('Tisch')+' '+tb,itemsText(o,s)+(note?'\n⚠ '+note:''),['bell']);
      toast('📤 '+t('Gesendet')+' – '+t('Tisch')+' '+tb,'info',2500)}catch(e){showErr(e)}},
  async confirm(x){const o=orders.find(o=>o.id===x);if(!o)return;
    const items=o.items.map(i=>{const m=conf.items.find(m=>m.id===i.itemId);if(!m)return i;const c=conf.cats.find(c=>c.id===m.cat);return {...i,price:+m.price,st:(c&&c.st)||i.st}});
    o.items=items;const st={};for(const i of items)st[i.st]='neu';
    await write(Store.updDoc('orders/'+x,{status:'ok',st,items,waiter:me.name,confirmedMs:Date.now()}));
    for(const s of Object.keys(st))push(cfg,topicStation(s),'🔔 '+t('Neue Bestellung')+' – '+t('Tisch')+' '+o.table,itemsText(o,s),['bell'])},
  decline(x){if(confirm(t('Ablehnen')+'?'))write(Store.updDoc('orders/'+x,{status:'declined',waiter:me.name}))},
  callDone(x){write(Store.updDoc('calls/'+x,{done:true,doneBy:me.name}))},
  pickup(x){const [id,s]=x.split(':');write(Store.updDoc('orders/'+id,{['st.'+s]:'abgeholt'}))},
  closeTable(x){if(!confirm(t('Tisch wirklich abschließen?')))return;const s=sessOf(x);
    const list=[['tables/'+x,{session:null,closedMs:Date.now()}],...orders.filter(o=>o.session===s).map(o=>['orders/'+o.id,{paid:true}]),...openCalls(x).map(c=>['calls/'+c.id,{done:true}])];
    write(Store.batchUpd(list).then(()=>toast('💶 '+t('Tisch abgeschlossen'),'info',2500)));ui.sheet=null;render()},
  ktab(x){ui.ktab=x;render()},
  kst(x){const [id,v]=x.split(':');const o=orders.find(o=>o.id===id);write(Store.updDoc('orders/'+id,{['st.'+me.station]:v}));
    if(v==='fertig'&&o&&o.waiter)push(cfg,topicWaiter(o.waiter),'✅ '+t('Tisch')+' '+o.table+' – '+t(STN[me.station])+' '+t('fertig'),itemsText(o,me.station),['white_check_mark'])},
  async unlock(){const code=$('#acode').value.trim().toUpperCase().replace(/\s+/g,''),nm=$('#nm').value.trim();if(!code)return;me.name=nm||me.name;saveMe();
    const d={code,name:me.name||'',at:Date.now()},u=Store.authUid();
    try{await Store.setDoc('admins/'+u,d);toast('✅ Admin','info',2000);return}catch(e){}
    try{await Store.setDoc('staff/'+u,d);toast('✅ '+t('Freigeschaltet'),'info',2000)}catch(e){toast(t('Falscher Code'),'err')}},
  delDev(x){if(confirm(t('Gerät entfernen?')))write(Store.delDoc(x))},
  atab(x){ui.atab=x;render();scrollTo(0,0)},
  wd(x){ui.wd=+x;render()},
  av(x){const it=conf.items.find(i=>i.id===x);const k=catOf(it)?.st==='kueche';setToday(d=>{if(k){if(d.on[x])delete d.on[x];else d.on[x]=true}else{if(d.off[x])delete d.off[x];else d.off[x]=true}})},
  avAll(x){const [c,v]=x.split(':');const cat=conf.cats.find(k=>k.id===c),k=cat.st==='kueche';setToday(d=>{for(const i of conf.items.filter(i=>i.cat===c)){if(k){if(v==='1')d.on[i.id]=true;else delete d.on[i.id]}else{if(v==='1')delete d.off[i.id];else d.off[i.id]=true}}})},
  tplSave(){const fresh=today&&today.day===dayKey();write(Store.setDoc('config/templates',{[ui.wd]:{on:fresh?today.on||{}:{},off:fresh?today.off||{}:{}}},true).then(()=>toast(t('Gespeichert'),'info',1500)))},
  tplLoad(){const tp=templates[ui.wd];if(!tp)return;setToday(d=>{d.on={...(tp.on||{})};d.off={...(tp.off||{})}})},
  addCat(){ui.draft.cats.push({id:uid(),name:t('Kategorie'),st:'kueche'});render()},
  delCat(x){if(!confirm(t('Löschen')+'?'))return;ui.draft.cats=ui.draft.cats.filter(c=>c.id!==x);ui.draft.items=ui.draft.items.filter(i=>i.cat!==x);render()},
  addItem(x){ui.draft.items.push({id:uid(),cat:x,name:'',price:0});render()},
  delItem(x){ui.draft.items=ui.draft.items.filter(i=>i.id!==x);render()},
  dropDraft(){ui.draft=null;render()},
  saveMenu(){const d=ui.draft;d.items=d.items.filter(i=>i.name.trim());write(Store.setDoc('config/main',{...C0(conf),cats:d.cats,items:d.items}).then(()=>toast(t('Gespeichert'),'info',1500)));ui.draft=null},
  saveTables(){const tb=$('#tbl').value.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);write(Store.setDoc('config/main',{...C0(conf),tables:tb}).then(()=>toast(t('Gespeichert'),'info',1500)))},
  saveSetup(){write(Store.setDoc('config/main',{...C0(conf),hours:{open:$('#hopen').value,close:$('#hclose').value},wifi:{ssid:$('#wssid').value.trim(),pass:$('#wpass').value.trim()}}).then(()=>toast(t('Gespeichert'),'info',1500)))},
  reset(){if(!confirm('?'))return;LS.del('zb_cfg');location.reload()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.classList.contains('sheetbg')&&e.target!==b)return;
  if(b.tagName==='BUTTON'&&document.activeElement&&document.activeElement!==document.body)document.activeElement.blur?.();
  A[b.dataset.a]?.(b.dataset.x,b,e)});
const IN={
  note(x,v){const l=cart.find(l=>l.key===x);if(l){l.note=v;saveCart()}},
  onote(x,v){ui.onote=v},
  name(x,v){me.name=v.trim();saveMe();renderHeader()},
  alertAll(x,v,el){me.alertAll=el.checked;saveMe()},
  wake(x,v,el){me.wake=el.checked;saveMe();wake(me.wake)},
  cname(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c)c.name=v},
  cst(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c)c.st=v},
  iname(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i)i.name=v},
  iprice(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i)i.price=parseFloat(v.replace(',','.'))||0}
};
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el)IN[el.dataset.in]?.(el.dataset.x,el.value,el)});

let wl=null;async function wake(on){try{if(on&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen')}else{await wl?.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me.role==='kitchen'&&me.wake)wake(true)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.deferredInstall=e});

/* ============ Start ============ */
function subToday(){unsubDay.forEach(u=>u&&u());prevO=null;prevC=null;subDay=dayKey();
  unsubDay=[Store.subCol('orders','day',subDay,onOrders,showErr),Store.subCol('calls','day',subDay,onCalls,showErr)]}
async function start(){render();
  Store=makeStore(cfg);
  try{await Store.init()}catch(e){showErr(e);return}
  setConn(true);addEventListener('online',()=>setConn(true));addEventListener('offline',()=>setConn(false));
  if(cfg.mode!=='fb'){acc={checked:true,staff:true,admin:true};startData();return}
  const u=Store.authUid(),seen={};const upd=()=>{if(!('a' in seen&&'s' in seen))return;acc.checked=true;
    if((acc.staff||acc.admin)&&!dataOn)startData();
    if(acc.admin&&!devs.on){devs.on=true;Store.subCol('admins',null,null,l=>{devs.admins=l;render()});Store.subCol('staff',null,null,l=>{devs.staff=l;render()})}
    render()};
  Store.subDoc('admins/'+u,d=>{if(d===undefined)return;seen.a=1;acc.admin=!!d;upd()},()=>{seen.a=1;upd()});
  Store.subDoc('staff/'+u,d=>{if(d===undefined)return;seen.s=1;acc.staff=!!d;upd()},()=>{seen.s=1;upd()});
}
function startData(){dataOn=true;
  Store.subDoc('config/main',c=>{if(c===undefined)return;
    if(c===null){Store.setDoc('config/main',migrate(structuredClone(SAMPLE)));return}
    const mg=migrate(c);if(mg){write(Store.setDoc('config/main',C0(mg)));conf=mg}else{conf=c;if(acc.admin&&c.pin!==undefined)write(Store.setDoc('config/main',C0(c)))}render()},showErr);
  Store.subDoc('config/today',d=>{if(d===undefined)return;today=d;render()},showErr);
  Store.subDoc('config/templates',d=>{if(d===undefined)return;templates=d||{};render()},showErr);
  Store.subCol('tables',null,null,l=>{tables={};for(const x of l)tables[x.id]=x;render()},showErr);
  subToday()}
setInterval(()=>{if(!dataOn)return;if(Store&&dayKey()!==subDay)subToday();else if(!isEditing()&&!ui.sheet&&(me.role==='kitchen'||ui.wtab==='aktiv'))render()},30000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{});
if(me.role==='kitchen'&&me.wake)wake(true);
start();
</script>
</body>
</html>
