<html lang="de">
<head>

<style>

:root{--bg:#0f1614;--sf:#18221f;--sf2:#22302b;--ln:#2e3d37;--tx:#eef2ef;--mu:#93a39c;--gd:#c9a45c;--ok:#2fbf71;--wa:#f0a92b;--er:#e5484d;--bl:#4ea1ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.fa{font-family:Vazirmatn,system-ui,sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--ln)}
.brand{font-weight:800;letter-spacing:.5px;color:var(--gd);display:flex;align-items:center;gap:6px}
.hlogo{height:34px;width:auto;display:block}.ver{font-size:10px;opacity:.5}
.sig{text-align:center;font-size:11px;color:var(--mu);opacity:.7;margin:26px 0 6px;font-style:italic;letter-spacing:.3px}
.role{font-size:13px;color:var(--mu);background:var(--sf2);padding:3px 9px;border-radius:999px}
.sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok)}.dot.off{background:var(--er)}
main{padding:14px 16px;max-width:1200px;margin:0 auto}
button,.btn{font:inherit;color:inherit;border:0;border-radius:12px;background:var(--sf2);padding:12px 14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(.97)}
.pri{background:var(--gd);color:#1a1406;font-weight:700}
.ok{background:var(--ok);color:#06200f;font-weight:700}
.wa{background:var(--wa);color:#2a1a00;font-weight:700}
.er{background:transparent;color:var(--er);border:1px solid var(--er)}
.ghost{background:transparent;border:1px solid var(--ln)}
.w{width:100%}
.ico{min-width:46px;padding:8px;font-size:20px;background:transparent}
input,textarea,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:80px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:10px}
.tables{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.tbtn{height:66px;font-size:20px;font-weight:700;position:relative;background:var(--sf);border:1px solid var(--ln)}
.tbtn .b{position:absolute;top:7px;inset-inline-end:7px;width:10px;height:10px;border-radius:50%;background:var(--wa)}
.tbtn .b.g{background:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none;position:sticky;top:calc(57px + env(safe-area-inset-top));background:var(--bg);z-index:4}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;min-height:40px;border-radius:999px}
.chip.act{background:var(--gd);color:#1a1406;font-weight:700}
.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{text-align:start;flex-direction:column;align-items:stretch;justify-content:space-between;min-height:84px;position:relative;background:var(--sf);border:1px solid var(--ln)}
.item .p{color:var(--mu);font-size:14px}
.item .q{position:absolute;top:-7px;inset-inline-end:-7px;background:var(--gd);color:#1a1406;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:14px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 16px;z-index:6;max-width:700px;margin:0 auto}
.cartbar button{box-shadow:0 8px 24px #000a;font-size:17px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav#tabs:empty{display:none}
nav#tabs button{flex:1;background:none;border-radius:0;min-height:64px;font-size:13px;padding:0 2px;color:var(--mu)}
nav#tabs button.act{color:var(--gd);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--er);color:#fff;font-size:12px;font-weight:800;padding:0 6px}
.badge.g{background:var(--ok);color:#06200f}
.board{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.ocard{border-inline-start:6px solid var(--bl)}
.ocard.late{border-inline-start-color:var(--wa)}.ocard.vlate{border-inline-start-color:var(--er)}.ocard.ready{border-inline-start-color:var(--ok)}
.ocard.new{animation:fl 1s ease 4}
@keyframes fl{50%{box-shadow:0 0 0 4px var(--gd)}}
.ohd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.tno{font-size:26px;font-weight:800}
.meta{color:var(--mu);font-size:14px}
.li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln);font-size:18px}
.li:last-child{border:0}
.li b{min-width:36px;color:var(--gd)}
.li.sm{font-size:15px;padding:4px 0}
.note{background:#3a2d10;color:#ffd98a;border-radius:8px;padding:3px 8px;font-size:15px;margin-top:4px;display:inline-block}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.st{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sf2)}
.st.neu{color:var(--bl)}.st.arbeit{color:var(--wa)}.st.fertig{background:var(--ok);color:#06200f;font-weight:700}.st.abgeholt{color:var(--mu)}
.row{display:flex;gap:10px;align-items:center}
.row>.f{flex:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts>*{flex:1 1 auto}
.sheetbg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheetc{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;width:min(92vw,480px);pointer-events:none}
.toast{background:var(--ok);color:#06200f;font-weight:800;padding:14px 16px;border-radius:14px;box-shadow:0 10px 30px #000a;font-size:17px;pointer-events:auto}
.toast.info{background:var(--bl);color:#fff}.toast.err{background:var(--er);color:#fff}
h2{margin:6px 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:16px;color:var(--mu)}
.muted{color:var(--mu)}.sm{font-size:14px}
.qty{display:flex;align-items:center;gap:6px}.qty button{min-width:44px;padding:6px}
.qty span{min-width:26px;text-align:center;font-weight:800}
.big{font-size:22px;font-weight:800}
.stack>*+*{margin-top:10px}
code{background:var(--sf2);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:14px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.pinw{max-width:320px;margin:40px auto}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.seg{display:flex;background:var(--sf);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;background:none}
.seg button.act{background:var(--sf2);color:var(--gd);font-weight:700}
table.stat{width:100%;border-collapse:collapse}table.stat td{padding:6px 4px;border-bottom:1px solid var(--ln)}table.stat td:last-child{text-align:end}
.edrow{display:grid;grid-template-columns:1fr 92px 46px;gap:6px;margin-top:6px}
.strike{text-decoration:line-through;opacity:.55}

.zone{margin:18px 0 8px;color:var(--gd);font-weight:700;font-size:15px;letter-spacing:.3px;display:flex;justify-content:space-between}
.tb{height:74px;flex-direction:column;gap:2px;font-size:20px;font-weight:800;position:relative;background:var(--sf);border:1px solid var(--ln)}
.tb.occ{border-color:var(--gd);background:#1f2a20}
.tb .eur{font-size:12px;font-weight:600;color:var(--gd)}
.tb .bd{position:absolute;top:5px;inset-inline-end:5px;display:flex;gap:3px}
.tb .bd i{font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.bp{background:var(--wa);color:#2a1a00}.bc{background:var(--er);color:#fff}.br{background:var(--ok);color:#06200f}
.item.off{opacity:.38;pointer-events:none}
.item .off-l{font-size:12px;color:var(--er)}
.gst{margin-top:10px;border-top:1px dashed var(--ln);padding-top:8px}
.gst h4{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between}
.sum{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
.call{background:#3a1416;border:1px solid var(--er)}
.pend{border-inline-start:6px solid var(--wa)}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--sf2);border:1px solid var(--ln);flex:none;padding:0;min-height:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--mu);transition:.15s}
.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on::after{inset-inline-start:25px;background:#fff}
.avrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.avrow span{flex:1}
.wd{display:flex;gap:6px;flex-wrap:wrap}.wd button{min-height:38px;padding:6px 12px}
.wd button.act{background:var(--gd);color:#1a1406;font-weight:700}
#alarm.on{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:abl 1s steps(1) infinite}
#alarm.a-call{--ac:#b3121a}#alarm.a-new{--ac:#c76a00}#alarm.a-ready{--ac:#13843f}
@keyframes abl{0%{background:var(--ac)}50%{background:#000}}
.alw{width:100%;max-width:520px;text-align:center;color:#fff}
.ali{background:rgba(0,0,0,.55);border-radius:16px;padding:16px;margin-bottom:12px}
.alm{font-size:28px;font-weight:900;line-height:1.2}.alb{font-size:17px;margin-top:8px;opacity:.95}
.alok{width:100%;min-height:76px;font-size:26px;font-weight:900;background:#fff;color:#000;border-radius:18px;margin-top:8px}
.shiftc{max-width:520px;margin:30px auto;text-align:center}
.shiftc .big{font-size:26px}
.duty{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}.duty span{flex:1}

.back{min-width:40px;font-size:22px;margin-inline-end:-4px}
.ptop{height:150px;border-radius:16px;background-size:cover;background-position:center;margin:4px 0 14px;position:relative;box-shadow:inset 0 -60px 60px -20px rgba(15,22,20,.85)}
.kwait{background:#3a2d10;color:#ffd98a;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;font-size:15px}
.kwait.er2{background:#3a1416;color:#ffb4b4}
.clockg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.clk{flex-direction:column;align-items:flex-start;text-align:start;min-height:84px;background:var(--sf);border:1px solid var(--ln);gap:4px}
.clk b{font-size:18px}.clk.in{border-color:var(--ok);background:#14281d}
.pind{display:flex;justify-content:center;gap:16px;margin:16px 0}
.pind i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gd)}.pind i.on{background:var(--gd)}
.keyp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.keyp button{min-height:66px;font-size:26px;font-weight:800;background:var(--sf2)}
.g2{grid-template-columns:1fr 1fr}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:8px;font-size:14px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--gd),#e8c98a);min-width:2px}
.bar b{font-weight:700;font-size:13px;white-space:nowrap}
.dl{font-size:12px;font-weight:700;margin-inline-start:4px}.dl.up{color:var(--ok)}.dl.dn{color:var(--er)}
.tw{overflow-x:auto}.wt td{white-space:nowrap;padding:8px 6px}.wt td:last-child{text-align:end}
.inact{opacity:.5}
.trow span b{color:var(--gd)}
nav#tabs button .ti{display:block;font-size:18px;line-height:1.1}
.adm nav#tabs button{font-size:10.5px;flex-direction:column;gap:2px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mrow{grid-template-columns:1fr 74px 58px 40px}.mrow select{padding:11px 4px}
.seg{flex-wrap:wrap}
.acts[style*="position:sticky"]{background:var(--bg);padding:8px 0;margin-bottom:0}
/* v12 final: Küche/Tablet */
.lseg button{font-size:14px;padding:0 4px}
.cgh{font-size:12px;font-weight:800;color:var(--gd);margin:8px 0 2px;letter-spacing:.3px}
.khint{background:#3a2d10;color:#ffd98a;border-radius:8px;padding:5px 9px;font-size:14px;font-weight:700;margin:6px 0}
.kgrp{border-top:1px dashed var(--ln);margin-top:8px;padding-top:6px}
.kgrp .kgh{font-weight:800;color:var(--gd);font-size:15px;display:flex;gap:8px;align-items:center}
.kgrp.dim{opacity:.45}
.pmb{min-height:34px;min-width:38px;padding:2px 6px;font-size:15px;flex:none;filter:grayscale(1);opacity:.5}.pmb.on{filter:none;opacity:1;border-color:var(--er)}
.chk2{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0;color:var(--tx);font-size:15px}.chk2 input{width:20px;height:20px}
.stk{margin-bottom:8px}.stk.warn{border-color:var(--wa);background:#2a2412}
.ti{position:relative}.tb2{position:absolute;top:-6px;inset-inline-end:-14px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
/* Tablet: Küchenansicht groß, hoch & quer */
body.kv .board{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media (min-width:700px){body.kv main{max-width:none}body.kv .li{font-size:22px}body.kv .tno{font-size:30px}body.kv .ocard .acts button{min-height:58px;font-size:19px}body.kv .kgrp .kgh{font-size:17px}}
@media (min-width:1000px){body.kv .board{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media (orientation:landscape) and (max-height:520px){body.kv header{padding-top:4px;padding-bottom:4px}body.kv nav#tabs button{min-height:48px}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="cartbar"></div>
<nav id="tabs"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<div id="alarm"></div>
<script src="data.js"></script>
<script type="module">
import {DEFAULT_CFG,LS,uid,dayKey,makeStore,push,isAvail,isOpenNow,ZONES,zoneOf as zoneOf0,zonesOf,zonesFromLegacy,allTablesOf,DEFAULT_WEEK,weekOf,staffActive,nextOpen,dayHours,personalTopic,pushShift,KST,isKitchenSt,stOf,isShishaCat,kitchenFrom,kitchenWaiting,autoOutMs,entryMin,fmtMin,dateOfDay} from './store.js';
const VER='v12';
const zoneOf=t=>zoneOf0(t,conf);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'<bdi>'+(Math.round((+n||0)*100)/100).toFixed(2).replace('.',',')+' €</bdi>';
const eurT=n=>(Math.round((+n||0)*100)/100).toFixed(2).replace('.',',')+' €';
const num2=n=>(Math.round((+n||0)*100)/100).toFixed(2).replace('.',',');
const hhmm=ms=>new Date(ms).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
const ddmm=ms=>new Date(ms).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'});
const mins=ms=>Math.max(0,Math.floor((Date.now()-ms)/60000));
const hash=s=>{let h=5381;for(const c of s)h=(((h<<5)+h)^c.codePointAt(0))>>>0;return h.toString(36)};
const norm=s=>String(s||'').trim().toLowerCase();
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const APPURL=location.origin+location.pathname;
const BASEURL=APPURL.replace(/[^/]*$/,'');
const DOMAIN='team.restaurant-am-zirlerberg.at';
const pad2=n=>String(n).padStart(2,'0');
const fmtDay=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const addDays=(s,n)=>{const d=dateOfDay(s);d.setDate(d.getDate()+n);return fmtDay(d)};
const dayList=(a,b)=>{const r=[];for(let d=a;d<=b&&r.length<400;d=addDays(d,1))r.push(d);return r};
const slug=s=>norm(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,'');
async function pinHash(pid,pin){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('zb:'+pid+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

let AC=null,CMP=null;
function acInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();
  if(!CMP){CMP=AC.createDynamicsCompressor();CMP.threshold.value=-24;CMP.knee.value=0;CMP.ratio.value=12;CMP.attack.value=0;CMP.release.value=.08;const g=AC.createGain();g.gain.value=1.4;CMP.connect(g);g.connect(AC.destination)}}catch(e){}}
addEventListener('pointerdown',acInit,{capture:true});
function tone(f0,f1,at,dur,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,at);o.frequency.linearRampToValueAtTime(f1,at+dur);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.9,at+.012);g.gain.setValueAtTime(.9,at+dur-.03);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(CMP);o.start(at);o.stop(at+dur+.02)}
function sound(kind){if(!AC||!CMP)return;const n=AC.currentTime+.02;
  const seq=kind==='ready'?[[880,880,0,.16],[1175,1175,.19,.16],[1568,1568,.38,.16],[1568,1568,.6,.4]]:(kind==='call'||kind==='esc')?[[650,1450,0,.34],[1450,650,.36,.34],[650,1450,.72,.34],[1450,650,1.08,.34]]:[[620,980,0,.24],[980,620,.27,.24],[620,980,.54,.24],[980,620,.81,.24]];
  for(const [a,b,d,l] of seq){tone(a,b,n+d,l,'square');tone(a*1.012,b*1.012,n+d,l,'sawtooth')}}
const VIB=[900,150,900,150,900,150,1400];
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function notify(title,body){try{if(!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='visible')return;
  const r=await navigator.serviceWorker?.getRegistration();if(r)r.showNotification(title,{body,tag:uid(),vibrate:VIB,requireInteraction:true,renotify:true,icon:'icon-192.png'});else new Notification(title,{body})}catch(e){}}
function toast(msg,kind='',ms=4500){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;d.onclick=()=>d.remove();$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
function alert2(kind,msg,body,cls,key){if(!onShift())return;notify(msg,body||'');
  const k=key||msg;if(!alarms.some(a=>a.k===k))alarms.push({k,kind,msg,body:body||'',at:Date.now()});ring();renderAlarm()}
function ring(){if(!alarms.length){clearInterval(alarmT);alarmT=null;vib(0);return}const k=alarms[alarms.length-1].kind;sound(k);vib(VIB);
  if(!alarmT)alarmT=setInterval(()=>{if(!alarms.length){clearInterval(alarmT);alarmT=null;return}sound(alarms[alarms.length-1].kind);vib(VIB)},2600)}
function renderAlarm(){const el=$('#alarm');if(!alarms.length){el.innerHTML='';el.className='';return}
  const k=alarms.some(a=>a.kind==='call'||a.kind==='esc')?'a-call':alarms.some(a=>a.kind==='new')?'a-new':'a-ready';
  el.className='on '+k;el.innerHTML=`<div class="alw">${alarms.slice(-5).reverse().map(a=>`<div class="ali"><div class="alm">${esc(a.msg)}</div>${a.body?`<div class="alb">${esc(a.body).replace(/\n/g,'<br>')}</div>`:''}</div>`).join('')}
   ${alarms.length>5?`<div class="alb">+${alarms.length-5}</div>`:''}<button class="alok" data-a="seen">${t('Gesehen')} ✓</button></div>`}

function onOrders(list){
  const first=prevO===null,np=new Map(),R=role();
  for(const o of list){np.set(o.id,o);if(first)continue;const p=prevO.get(o.id);
    for(const s of myStations()){const ks=[s+'_v',s];
      const nowNew=valid(o)&&ks.some(k=>o.st?.[k]==='neu'), wasNew=p&&valid(p)&&ks.some(k=>p.st?.[k]);
      if(nowNew&&!wasNew){ui.seen.add(o.id);if(!(o.source==='staff'&&o.waiterUid===myUid()))alert2('new','🔔 '+STI[s]+' '+t('Neue Bestellung')+' – '+t('Tisch')+' '+o.table,stationText(o,s),'info','k'+o.id+s)}
      if(p&&!p.cancelled&&o.cancelled&&ks.some(k=>o.st?.[k]))toast('✖ '+t('Tisch')+' '+o.table+' – '+t('Storniert'),'err',8000)}
    if(isWaiterNow()){
      if(o.status==='pending'&&!o.cancelled&&(!p||p.status!=='pending'))alert2('new','🧾 '+t('Neue Gastbestellung')+' – '+t('Tisch')+' '+o.table,itemsText(o),'info','o'+o.id);
      if(o.status==='pending'&&!o.cancelled&&o.escMs&&p&&!p.escMs)alert2('esc','⚠ '+t('Tisch')+' '+o.table+' '+t('wartet seit 2 Min.'),itemsText(o),'err','e'+o.id);
      if(p&&p.status==='pending'&&o.status!=='pending')dropAlarm('o'+o.id,'e'+o.id);
      if(mineO(o))for(const s of Object.keys(o.st||{}))if(o.st[s]==='fertig'&&p?.st?.[s]!=='fertig')
        alert2('ready','✅ '+t('Tisch')+' '+o.table+' – '+stLabel(s)+' '+t('fertig'),itemsText(o,s),'','r'+o.id+s)}
  }
  prevO=np;orders=list;render()}
function onCalls(list){

  for(const c of list){np.set(c.id,c);if(first||!isWaiterNow())continue;const p=prevC.get(c.id);
    if(!c.done&&!p)alert2('call',(c.type==='bill'?'🧾 ':'🙋 ')+t('Tisch')+' '+c.table+' – '+t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'','err','c'+c.id);
    if(!c.done&&c.escMs&&p&&!p.escMs)alert2('esc','⚠ '+t('Tisch')+' '+c.table+' '+t('wartet seit 2 Min.'),t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'err','ce'+c.id);
    if(c.done&&p&&!p.done)dropAlarm('c'+c.id,'ce'+c.id)}
  prevC=np;calls=list;render()}
function dropAlarm(...ks){const n=alarms.length;alarms=alarms.filter(a=>!ks.includes(a.k));if(alarms.length!==n){renderAlarm();if(!alarms.length)ring()}}

const ESC_MS=120000;

    alert2('esc','⚠ '+t('Tisch')+' '+o.table+' '+t('wartet seit 2 Min.'),itemsText(o),'err','e'+o.id);
    pushShift(cfg,shifts,s=>s.role==='waiter',topicService(),'⚠ Tisch '+o.table+' wartet seit 2 Min.','Gastbestellung noch nicht bestätigt',['rotating_light'])}
  for(const c of openCalls())if(!c.escMs&&now-c.createdMs>ESC_MS){c.escMs=now;write(Store.updDoc('calls/'+c.id,{escMs:now}));
    alert2('esc','⚠ '+t('Tisch')+' '+c.table+' '+t('wartet seit 2 Min.'),t(c.type==='bill'?'Rechnung gewünscht':'Kellner gerufen'),'err','ce'+c.id);

function statsOf(os,cs){const S=S0(),ses=new Set(),paid={};
  const W=n=>S.waiters[n||'–']??={o:0,r:0,calls:0,tabs:0,reMs:0,reN:0};
  for(const o of os){if(o.cancelled){S.canc++;continue}if(o.status==='declined'){S.decl++;continue}if(o.status==='pending')continue;
    const r=tot(o);S.n++;S.rev+=r;ses.add(o.table+'|'+o.session);const w=W(o.waiter);w.o++;w.r+=r;
    if(o.source==='guest'&&o.confirmedMs&&o.createdMs){const d=o.confirmedMs-o.createdMs;if(d>=0&&d<36e5){S.reMs+=d;S.reN++;w.reMs+=d;w.reN++}}
    if(o.paidBy)paid[o.table+'|'+o.session]=o.paidBy;
    for(const i of o.items){const k=String(i.itemId||i.name).replace(/[.\/]/g,'_');const m=conf&&conf.items.find(x=>x.id===i.itemId);
      const it=S.items[k]??={n:i.name,c:m?m.cat:'',q:0,r:0};it.q+=i.qty;it.r+=i.qty*i.price}
    for(const [s,ms] of Object.entries(o.stMs||{})){const d=ms-(o.confirmedMs||o.createdMs);if(d>=0&&d<36e5){const x=S.st[s]??={ms:0,n:0};x.ms+=d;x.n++}}}

  for(const c of cs){S.calls++;if(c.done){S.callsDone++;if(c.doneMs){const d=c.doneMs-c.createdMs;if(d>=0&&d<36e5){S.callMs+=d;S.callN++}}if(c.doneBy)W(c.doneBy).calls++}}

    const [os,cs]=await Promise.all([Store.query('orders',[['day','>=',x],['day','<=',y]],{server:true}),Store.query('calls',[['day','>=',x],['day','<=',y]],{server:true})]);

      const doc=empty?{day:d,v:1,empty:true,at:Date.now()}:{...S,day:d,v:1,at:Date.now()};have.set(d,doc);wr.push(['days/'+d,doc])}

function menuDiff(a,b){const out=[];const ai=new Map(a.items.map(i=>[i.id,i]));

  for(const o of ai.values())out.push('− '+o.name);

      ...[...D.times].sort((p,q)=>p.inMs-q.inMs).map(e=>[e.day,e.name,t(ROLES[e.role]||e.role||''),hhmm(e.inMs),e.outMs?hhmm(e.outMs):'',e.breakMin||0,fmtMin(entryMin(e)),e.src||'',e.auto?'x':'',(e.edits||[]).length?'x':'',e.orig?hhmm(e.orig.inMs)+'–'+(e.orig.outMs?hhmm(e.orig.outMs):''):'',e.deleted?'x':'',e.note||''])]);
    if(x==='log')csvDl(f,[[t('Zeit'),t('Wer'),t('Was')],...[...D.logs].sort((p,q)=>p.ms-q.ms).map(l=>[new Date(l.ms).toLocaleString('de-AT'),l.by,l.text])])},
  myTimes(){ui.mytimes=null;ui.mm=monthKey(new Date());go({sheet:'mytimes'})},
  pwShow(){go({sheet:'pw'})},
  async pwSave(){const o=$('#pw0').value,n=$('#pw1').value,n2=$('#pw2').value;if(n.length<6||n!==n2){toast(t('Passwort mind. 6 Zeichen und zweimal gleich'),'err');return}
    try{await Store.changePassword(o,n);toast('✅ '+t('Passwort geändert'),'info',3000);back()}catch(e){const c=String(e.code||e.message);toast(/wrong|invalid|credential/.test(c)?t('Aktuelles Passwort falsch'):c,'err',6000)}},
  async delOldDevs(){if(!confirm(t('Alle alten Freischaltungen löschen?')))return;for(const d of oldDevs.admins)await write(Store.delDoc('admins/'+d.id));for(const d of oldDevs.staff)await write(Store.delDoc('staff/'+d.id));logA('team',t('Alte Geräte-Freischaltungen gelöscht'));toast(t('Gelöscht'),'info',2000)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.classList.contains('sheetbg')&&e.target!==b)return;
  if(b.disabled)return;
  if(b.tagName==='BUTTON'&&document.activeElement&&document.activeElement!==document.body)document.activeElement.blur?.();
  A[b.dataset.a]?.(b.dataset.x,b,e)});
const blurRender=()=>{document.activeElement?.blur?.();pending=false;render()};
const IN={
  note(x,v){const l=cart.find(l=>l.key===x);if(l){l.note=v;saveCart()}},
  onote(x,v){ui.onote=v},
  alertAll(x,v,el){me.alertAll=el.checked;saveMe()},
  wake(x,v,el){me.wake=el.checked;saveMe();wake(me.wake)},
  cname(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c)c.name=v},
  cst(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c)c.st=v},
  ccourse(x,v){const c=ui.draft.cats.find(c=>c.id===x);if(c){if(v)c.course=v;else delete c.course}},
  ist(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i){if(v)i.st=v;else delete i.st}},
  iname(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i)i.name=v},
  iprice(x,v){const i=ui.draft.items.find(i=>i.id===x);if(i)i.price=parseFloat(v.replace(',','.'))||0},
  zname(x,v){if(ui.zdraft&&ui.zdraft[x])ui.zdraft[x].name=v},
  qrWifi(x,v,el){ui.qrWifi=el.checked},
  npRole(x,v){ui.npName=$('#np_n')?.value||'';ui.npRole=v;blurRender();const n=$('#np_n');if(n)n.value=ui.npName},
  hCmp(x,v,el){H.cmp=el.checked;blurRender()}
};
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el)IN[el.dataset.in]?.(el.dataset.x,el.value,el)});

let wl=null;async function wake(on){try{if(on&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen')}else{await wl?.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&role()==='kitchen'&&me.wake)wake(true)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.deferredInstall=e});

/* ============ Start ============ */
function subToday(){unsubDay.forEach(u=>u&&u());prevO=null;prevC=null;subDay=dayKey();
  unsubDay=[Store.subCol('orders','day',subDay,onOrders,showErr),Store.subCol('calls','day',subDay,onCalls,showErr),Store.subCol('shift','day',subDay,l=>{shifts=l;render()},showErr)]}
let unsubMem=null;
async function checkAuth(){unsubMem?.();const u=myUid();
  if(Store.isAnon()){mem=null;LS.del('zb_mem');let boot=false;try{boot=!!(await Store.getDoc('admins/'+u))}catch(e){}auth=boot?'boot':'login';render();return}
  const cached=LS.get('zb_mem',null);if(cached&&cached.id===u&&cached.active){mem=cached;auth='ok';afterMem();startData()}
  unsubMem=Store.subDoc('team/'+u,d=>{if(d===undefined)return;
    if(!d||d.active!==true){const was=dataOn;mem=null;auth='noaccess';LS.del('zb_mem');alarms=[];renderAlarm();ring();render();if(was)setTimeout(()=>location.reload(),1500);return}
    if(mem&&mem.role!==d.role){LS.set('zb_mem',d);location.reload();return}mem=d;LS.set('zb_mem',d);auth='ok';afterMem();if(!dataOn)startData();render()},
    e=>{console.error(e);if(auth!=='ok'){auth='noaccess';render()}})}
function afterMem(){if(mem&&mem.role==='station'&&!me.stSet){me.station=mem.station||'kueche';me.stSet=true;saveMe()}if(mem&&mem.name&&me.name!==mem.name){me.name=mem.name;saveMe()}}
let extraOn=false;
function startData(){dataOn=true;
  Store.subDoc('config/main',c=>{if(c===undefined)return;
    if(c===null){if(isAdm())write(Store.setDoc('config/main',migrate(structuredClone(SAMPLE))));return}
    const mg=migrate(c);if(mg){if(isAdm())write(Store.setDoc('config/main',C0(mg)));conf=mg}else conf=c;LS.set('zb_conf',C0(conf));render()},showErr);
  Store.subDoc('config/today',d=>{if(d===undefined)return;today=d;LS.set('zb_today',d);render()},showErr);
  Store.subDoc('config/templates',d=>{if(d===undefined)return;templates=d||{};render()},showErr);
  Store.subCol('tables',null,null,l=>{tables={};for(const x of l)tables[x.id]=x;render()},showErr);
  subToday();startExtra()}
function startExtra(){if(extraOn||!(isAdm()||mem&&mem.role==='station'||isDemo()))return;extraOn=true;
  Store.subCol('team',null,null,l=>{team=l;render()},showErr);
  Store.subCol('time','open',true,l=>{timeOpen=l;render()},showErr);
  if(isAdm()){Store.subDoc('config/stock',d=>{if(d===undefined)return;stockDoc=d||null;render()},()=>{});setTimeout(()=>loadStock(),4000)}
  if(!isDemo()&&isAdm()){Store.subCol('admins',null,null,l=>{oldDevs.admins=l;render()},()=>{});Store.subCol('staff',null,null,l=>{oldDevs.staff=l;render()},()=>{})}}
async function start(){render();
  Store=makeStore(cfg,{app:'staff'});
  try{await Store.init()}catch(e){showErr(e);return}
  setConn(navigator.onLine!==false);addEventListener('online',()=>setConn(true));addEventListener('offline',()=>setConn(false));
  if(isDemo()){auth='ok';startData();return}
  await checkAuth()}
setInterval(()=>{if(!dataOn)return;if(onShift()&&conf&&!staffActive(conf))A.shiftEnd('auto');autoClose();
  if(Store&&dayKey()!==subDay)subToday();else if(!isEditing()&&!ui.sheet&&(role()==='kitchen'||ui.wtab==='aktiv'||String(ui.wtab).startsWith('st:')||ui.atab==='team'))render()},30000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{});
if(role()==='kitchen'&&me.wake)wake(true);
LS.del('zb_acc');
start();
</script>
