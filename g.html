.nm{font-size:23px;line-height:1.15;margin:0}

  if(ui.sheet==='wifi'){const w=conf.wifi||{};return `<div class="shh"><h2 class="serif">📶 ${tr('wifi')}</h2><button class="x" data-a="close">✕</button></div>
    <label>${tr('net')}</label><div class="wifi"><span>${esc(w.ssid)}</span></div>
    <label>${tr('pw')}</label><div class="wifi"><span>${esc(w.pass)}</span><button data-a="copy" data-x="${esc(w.pass)}" style="color:var(--gold)">${tr('copy')}</button></div>`}
  return ''}

/* ============ Aktionen ============ */
function toast(msg,kind='',ms=3500){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
const PAIR_FOR=['per','gri'],PAIR_NAMES=['Mast o Khiar','Persischer Safrantee'];
function addToCart(it,qty,note){const c=catOf(it);
  const l=cart.find(l=>l.itemId===it.id&&(l.note||'')===(note||''));if(l)l.qty+=qty;else cart.push({key:uid(),itemId:it.id,name:it.name,price:+it.price,st:c?.st||'kueche',qty,note:note||''});
  saveCart();try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  if(PAIR_FOR.includes(it.cat)&&!LS.get('zbg_paired',false)){const ids=conf.items.filter(i=>PAIR_NAMES.includes(i.name)&&!blockReason(i)&&!qtyIn(i.id)).map(i=>i.id);
    if(ids.length){LS.set('zbg_paired',true);ui.sheet='pair';ui.arg=ids}}}
function guardShisha(it,then){if(catOf(it)?.st==='shisha'&&!ui.ageOk){ui.sheet='age';ui.arg=then;render();return true}return false}
const A={
  lang(x){lang=x;LS.set('zbg_lang',x);render()},
  go(x){ui.view=x;ui.sheet=null;render();scrollTo(0,0)},
  close(){ui.sheet=null;render()},
  jump(x){const el=document.getElementById('c-'+x);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},
  flt(x){ui.flt[x]=!ui.flt[x];render()},
  item(x){ui.sheet='item';ui.arg=x;ui.dq=1;ui.dn='';render()},
  quick(x,el,e){e.stopPropagation();const it=conf.items.find(i=>i.id===x);if(!it||blockReason(it)||!canOrder())return;
    if(guardShisha(it,()=>{addToCart(it,1,'');render()}))return;addToCart(it,1,'');render()},
  dq(x){ui.dq=Math.max(1,ui.dq+ +x);ui.dn=$('#inote')?.value||'';render()},
  addD(){const it=conf.items.find(i=>i.id===ui.arg);const note=($('#inote')?.value||'').trim(),q=ui.dq;ui.sheet=null;
    if(guardShisha(it,()=>{addToCart(it,q,note);render()}))return;addToCart(it,q,note);render()},
  ageOk(){if(!$('#agechk').checked)return;ui.ageOk=true;const f=ui.arg;ui.sheet=null;f&&f();if(!ui.sheet)render()},
  openCart(){ui.sheet='cart';render()},
  cq(x){const [k,d]=x.split(':');const l=cart.find(l=>l.key===k);if(!l)return;l.qty+=+d;if(l.qty<=0)cart=cart.filter(c=>c!==l);saveCart();if(!cart.length)ui.sheet=null;render()},
  async sendO(x,el){if(!cart.length||!canOrder())return;const name=($('#gname')?.value||'').trim().slice(0,24);G.name=name;saveG();
    el.disabled=true;el.textContent=tr('wait');
    try{const s=await Store.claimSession(T);if(G.session!==s){G.session=s;G.gid=uid()}G.had=true;saveG();join(s);
      const items=cart.map(({name,price,qty,note,st,itemId})=>({name,price,qty,note,st,itemId}));
      const o={id:uid(),day:dayKey(),createdMs:Date.now(),table:T,session:s,guestId:G.gid,guestName:name||'',source:'guest',status:'pending',note:'',cancelled:false,st:{},items,by:Store.authUid()};
      await Store.setDoc('orders/'+o.id,o);
      push(cfg,cfg.topic+'-service','🧾 Gastbestellung – Tisch '+T,(name?name+': ':'')+items.map(i=>i.qty+'× '+i.name+(i.note?' ('+i.note+')':'')).join('\n'),['bell']);
      cart=[];saveCart();ui.sheet=null;ui.view='table';render();scrollTo(0,0);toast('✓ '+tr('sent'),'',5000)}
    catch(e){console.error(e);toast(tr('err'),'err',6000);el.disabled=false;el.textContent=tr('send')}},
  cancelO(x){if(confirm(tr('reallyCancel')))Store.updDoc('orders/'+x,{cancelled:true}).catch(()=>toast(tr('err'),'err'))},
  async callW(x){if(!T)return;if(Date.now()<ui.cooldown){toast(tr('tooFast'));return}ui.cooldown=Date.now()+60000;
    try{const id=uid();await Store.setDoc('calls/'+id,{table:T,type:x,day:dayKey(),createdMs:Date.now(),done:false,session:G.session||null,by:Store.authUid()});
      push(cfg,cfg.topic+'-service',(x==='bill'?'🧾 Rechnung':'🙋 Service')+' – Tisch '+T,'',['bell']);
      toast(x==='bill'?tr('billCalled'):tr('called'),'',5000)}catch(e){ui.cooldown=0;toast(tr('err'),'err')}},
  wifi(){ui.sheet='wifi';render()},
  copy(x){navigator.clipboard?.writeText(x).then(()=>toast(tr('copied'))).catch(()=>{})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
  if(b.classList.contains('sbg')&&e.target!==b)return;
  A[b.dataset.a]?.(b.dataset.x,b,e)});

/* ============ Start ============ */
function join(s){if(joinedS===s)return;joinedS=s;unsubO&&unsubO();unsubO=Store.subCol('orders','session',s,l=>{orders=l.filter(o=>String(o.table)===String(T));render()})}
async function start(){render();
  Store=makeStore(cfg);
  try{await Store.init()}catch(e){console.error(e);toast(tr('err'),'err',8000);return}
  Store.subDoc('config/main',c=>{if(c){conf=c;render()}});
  Store.subDoc('config/today',d=>{if(d!==undefined){today=d;render()}});
  if(T)Store.subDoc('tables/'+T,d=>{if(d===undefined)return;tableDoc=d;const s=d&&d.session;
    if(s&&G.session===s)join(s);
    else if(G.session&&s!==G.session){ if(G.had)ui.thanks=true; G={session:null,gid:null,name:G.name,had:false};saveG();orders=[];joinedS=null;unsubO&&unsubO();unsubO=null}
    render()});
}
setInterval(()=>{if(!ui.sheet)renderNav()},60000);
start();
</script>
</body>
